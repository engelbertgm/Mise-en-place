# Reglas si hay más de un idioma (i18n). hreflang y URL por idioma viven en seo.yaml.

- id: i18n-intl-formats
  title: "Fechas, números y moneda con Intl, nunca concatenados a mano"
  category: i18n
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: [i18n] }
  effort: { size: S, hours: [1, 3] }
  why: "1,000.50 en USA es 1.000,50 en Alemania y 1 000,50 en Francia; armarlo a mano falla."
  how: "Intl.NumberFormat, Intl.DateTimeFormat y formatters de next-intl con el locale activo."
  verify:
    - { type: grep, pattern: "Intl\\.(NumberFormat|DateTimeFormat)|useFormatter|format\\.number|format\\.dateTime", glob: "**/*.{ts,tsx,js,jsx}" }
    - { type: grep, pattern: "[\"'`]\\$\\s*[\"'`]\\s*\\+|toFixed\\(2\\)\\s*\\+\\s*[\"'`]\\s*(USD|MXN|EUR)", glob: "**/*.{ts,tsx,js,jsx}", expect: absent }

- id: i18n-language-selector
  title: Selector de idioma visible y persistente
  category: i18n
  level: required
  phase: build.ux
  since: "2026.10.2"
  when: { capabilities: [i18n] }
  effort: { size: S, hours: [1, 2] }
  why: "El usuario debe poder cambiar de idioma y que se recuerde."
  how: "Selector en header o footer con el nombre de cada idioma en su propio idioma; cookie NEXT_LOCALE."
  verify:
    - { type: grep, pattern: "LocaleSwitcher|LanguageSwitcher|useLocale|NEXT_LOCALE|switchLocale", glob: "**/*.{ts,tsx}" }

- id: i18n-text-expansion
  title: Layouts que aguantan textos más largos (alemán y francés crecen ~30%)
  category: i18n
  level: required
  phase: build.ux
  since: "2026.10.2"
  when: { capabilities: [i18n] }
  effort: { size: S, hours: [1, 3] }
  why: "Un botón diseñado para \"Save\" se rompe con \"Änderungen speichern\"."
  how: "Sin anchos fijos en botones y menús; revisar las vistas clave en el idioma más largo."
  verify:
    - { type: manual, prompt: "Vistas clave revisadas en el idioma con textos más largos" }

- id: i18n-currency-by-market
  title: Precios en la moneda del mercado
  category: i18n
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { all: [ { capabilities: [i18n] }, { capabilities: [payments] } ] }
  effort: { size: M, hours: [2, 6], scales_with: markets }
  why: "Pagar en moneda extranjera genera desconfianza y comisiones de conversión."
  how: "Precios por moneda (Prices de Stripe con currency_options) según el mercado del usuario."
  verify:
    - { type: grep, pattern: "currency_options|currency:\\s*[\"'](mxn|usd|eur|gbp|cad|brl|inr)", glob: "**/*.{ts,tsx}", flags: i }
