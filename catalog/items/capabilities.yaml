  title: Prompt de instalación propio en el momento adecuado
  category: pwa
  level: recommended
  phase: build.ux
  since: "2026.10.2"
  when: { capabilities: [pwa] }
  effort: { size: S, hours: [1, 3] }
  why: "El prompt nativo aparece en mal momento; uno propio tras una acción de valor convierte más."
  how: "Guardar beforeinstallprompt y mostrar el botón tras una acción de valor."
  verify:
    - { type: grep, pattern: "beforeinstallprompt", glob: "**/*.{ts,tsx}" }

- id: offline-strategy
  title: "Offline: caché por tipo de recurso, indicador sin conexión, cola de acciones y resolución de conflictos"
  category: offline
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: [offline] }
  effort: { size: XL, hours: [16, 40] }
  why: "Offline real exige decidir qué se guarda, qué pasa con las acciones y quién gana en un conflicto."
  how: "Estrategia de caché documentada (network-first, stale-while-revalidate…), cola persistente que se sincroniza al volver, regla de conflictos escrita en un ADR."
  verify:
