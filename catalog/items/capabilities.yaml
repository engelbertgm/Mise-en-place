    - { type: grep, pattern: "maskable", glob: "{app,src/app,public}/**/*.{ts,json,webmanifest}" }
    - { type: grep, pattern: "serwist|workbox|serviceWorker\\.register|next-pwa", glob: "**/*.{ts,tsx,js,mjs,json}" }

