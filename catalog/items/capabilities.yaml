# Funcionalidad por capacidad. La seguridad de cada capa vive en security.yaml.

# ── Auth ──
- id: password-recovery
  title: Recuperación de contraseña
  category: auth
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: [auth] }
  effort: { size: S, hours: [2, 4] }
  why: "Sin recuperación, cada contraseña olvidada es un usuario perdido o un ticket de soporte."
  how: "Flujo con enlace de un solo uso que expira, mensaje neutro (no revela si el email existe)."
  verify:
    - { type: grep, pattern: "resetPasswordForEmail|forgot-password|recuperar|reset-password|updateUser\\(\\{\\s*password", glob: "**/*.{ts,tsx,js,jsx}" }

- id: email-verification
  title: Verificación de email
  category: auth
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: [auth] }
  effort: { size: S, hours: [1, 3] }
  why: "Evita cuentas con correos ajenos o falsos y asegura que los emails transaccionales llegan."
  how: "Confirmación por email antes de activar la cuenta (Supabase: Confirm email activado)."
  verify:
    - { type: grep, pattern: "emailRedirectTo|verifyOtp|email_confirmed|confirm-email|verify-email|auth/confirm", glob: "**/*.{ts,tsx,js,jsx}" }

- id: account-deletion
  title: Borrar cuenta desde la app
  category: auth
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: [auth] }
  effort: { size: M, hours: [2, 5] }
  why: "Derecho del usuario en GDPR, LGPD, CCPA y otras; Apple y Google lo exigen para apps."
  how: "Acción extrema (confirmación escrita + reautenticación) que borra datos en DB, storage y terceros, con periodo de gracia."
  verify:
    - { type: grep, pattern: "deleteUser|delete-account|eliminar-cuenta|deleteAccount|borrar-cuenta", glob: "**/*.{ts,tsx,js,jsx}" }

- id: data-export
  title: Exportar mis datos
  category: auth
  level: recommended
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: [auth] }
  level_overrides:
    - { when: { markets: { any: [EU, UK, BR, "CA:QC"] } }, level: required }
  effort: { size: M, hours: [2, 5] }
  why: "Derecho de acceso y portabilidad (GDPR art. 15 y 20, LGPD, Ley 25 de Quebec)."
  how: "Descarga en JSON o CSV de los datos del usuario, generada en el servidor."
  verify:
    - { type: grep, pattern: "export-data|exportar-datos|exportUserData|download-my-data|data-export", glob: "**/*.{ts,tsx,js,jsx}" }
  references: ["https://eur-lex.europa.eu/eli/reg/2016/679/oj"]

# ── Pagos ──
- id: payment-result-pages
  title: Páginas de éxito y fallo de pago
  category: payments
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: [payments] }
  effort: { size: S, hours: [1, 3] }
  why: "El usuario necesita saber si pagó y qué sigue; el fallo debe ofrecer reintentar."
  how: "success_url y cancel_url propias; la de éxito confirma con el estado real del pago (webhook), no con el parámetro."
  verify:
    - { type: grep, pattern: "success_url|cancel_url|return_url|/(checkout|pago)/(success|exito|gracias)", glob: "**/*.{ts,tsx,js,jsx}" }

- id: payment-receipts
  title: Recibos por email
  category: payments
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: [payments] }
  effort: { size: S, hours: [1, 2] }
  why: "Comprobante para el usuario; lo exigen las leyes de consumo."
  how: "Recibos del procesador activados o email transaccional propio con el detalle."
  verify:
    - { type: grep, pattern: "receipt_email|receipt|recibo", glob: "**/*.{ts,tsx,js,jsx}", flags: i }

- id: tax-handling
  title: Manejo de impuestos
  category: payments
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: [payments] }
  effort: { size: M, hours: [2, 6], scales_with: markets }
  why: "IVA, sales tax y GST cambian por país y estado; cobrarlos mal es una deuda con la autoridad."
  how: "Stripe Tax (automatic_tax) o cálculo por mercado documentado; precios con o sin impuestos claros."
  verify:
    - { type: grep, pattern: "automatic_tax|tax_behavior|taxRates|tax_rates|impuesto|IVA", glob: "**/*.{ts,tsx,js,jsx}" }

