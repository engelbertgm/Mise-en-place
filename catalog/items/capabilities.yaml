# ── PWA y offline ──
- id: pwa-basics
  title: "PWA: manifest completo, íconos maskable, service worker y página offline"
  category: pwa
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: [pwa] }
  effort: { size: M, hours: [3, 8] }
  why: "Sin estas piezas el navegador no ofrece instalar y la app muestra el dinosaurio sin conexión."
  how: "manifest con name, icons (incluye maskable), start_url, display; service worker (Serwist); fallback offline."
