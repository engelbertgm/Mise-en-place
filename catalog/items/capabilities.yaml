# ── Email ──
- id: email-auth-dns
  title: SPF, DKIM y DMARC
  category: email
  level: required
  phase: launch.ops
  since: "2026.10.2"
  when: { capabilities: { any: [email, newsletter] } }
  effort: { size: S, hours: [1, 2] }
  why: "Sin autenticación, Gmail y Yahoo mandan los correos a spam o los rechazan."
  how: "Registros SPF y DKIM del proveedor y DMARC (p=quarantine o reject) en el DNS del dominio."
  verify:
    - { type: manual, prompt: "SPF, DKIM y DMARC configurados y verificados en el dominio de envío" }
  references: ["https://support.google.com/a/answer/81126"]

- id: email-templates
  title: "Plantillas transaccionales con tokens del sistema, texto plano, links absolutos, preheader, responsive y probadas en Gmail, Outlook y Apple Mail (claro y oscuro)"
  category: email
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: { any: [email, newsletter] } }
  effort: { size: M, hours: [3, 8] }
  why: "Un email roto en Outlook o ilegible en modo oscuro se ve poco profesional; sin texto plano, cae en spam."
  how: "Plantillas con los colores y tipografía de los tokens, versión texto, URLs absolutas https, preheader; pruebas en los tres clientes."
  verify:
    - { type: file_exists, path: ["{src/,}emails/**/*.{tsx,jsx,html,mjml}", "**/email-templates/**/*"] }
    - { type: manual, prompt: "Plantillas probadas en Gmail, Outlook y Apple Mail, claro y oscuro" }

- id: email-unsubscribe-marketing
  title: Enlace de baja en emails de marketing
  category: email
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: { any: [email, newsletter] } }
  effort: { size: XS, hours: [0.5, 1] }
  why: "Lo exigen CAN-SPAM, CASL, GDPR y los requisitos de Gmail y Yahoo."
  how: "Footer de todo email de marketing con enlace de baja funcional."
  verify:
    - { type: grep, pattern: "unsubscribe|darse de baja|dar de baja|cancelar suscripci", glob: "**/*.{tsx,jsx,ts,html,mjml}", flags: i }

- id: react-email
  title: Plantillas de email como componentes (React Email)
  category: email
  level: recommended
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: { any: [email, newsletter] } }
  effort: { size: S, hours: [1, 3] }
  why: "Reutilizan tokens y componentes; se previsualizan y prueban como código."
  how: "@react-email/components en emails/."
  verify:
    - { type: grep, pattern: "@react-email|react-email", glob: package.json }

# ── Newsletter ──
- id: newsletter-signup
  title: "Formulario de suscripción simple con anti-spam y qué se recibe y con qué frecuencia"
