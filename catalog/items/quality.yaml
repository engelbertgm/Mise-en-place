- id: git-protected-main
  title: "main protegida: sin push directo, PR con checks obligatorios (build, lint, tests, mep verify)"
  category: git
  level: recommended
  phase: foundation.setup
  since: "2026.10.2"
  level_overrides:
    - { when: { any: [ { context: client-project }, { signals: { team: team } } ] }, level: required }
  effort: { size: XS, hours: [0.5, 1] }
  why: "Es la barrera real: el deploy a producción ocurre al hacer merge."
  how: "Branch protection en GitHub con los checks del CI (incluido mep) como obligatorios."
  verify:
    - { type: file_exists, path: ".github/workflows/*.{yml,yaml}" }
    - { type: manual, prompt: "main protegida con los checks obligatorios en GitHub" }

