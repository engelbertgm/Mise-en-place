# Calidad de código (🔴 siempre, mantra del proyecto), calidad y despliegue, ADR, Git, analytics, costos y entrega.

- id: code-principles
  title: "Mantra: simple primero, reutilizar antes de crear, una responsabilidad, nombres que explican, consistencia, boy scout"
  category: quality
  level: required
  phase: foundation.setup
  since: "2026.10.2"
  effort: { size: XS, hours: [0.5, 1] }
  why: "El código claro y reutilizado es más barato de mantener y más difícil de romper."
  how: "Bloque del mantra en CLAUDE.md (lo agrega /mep:scope); al tercer uso de un patrón, se extrae."
  verify:
    - { type: grep, pattern: "Mantra de código", glob: CLAUDE.md }

- id: code-structure
  title: "Carpetas por feature o dominio con convención documentada; UI solo del sistema; un patrón de errores"
  category: quality
  level: required
  phase: foundation.setup
  since: "2026.10.2"
  effort: { size: S, hours: [1, 3] }
  why: "Saber dónde va cada cosa evita duplicados y discusiones."
  how: "Convención en el README y en CODEMAP.md; utilidades, tipos y constantes compartidos en un solo lugar; lógica de negocio fuera de los componentes."
  verify:
    - { type: grep, pattern: "^#+\\s*(Estructura|Structure|Convenciones|Conventions)", glob: README.md, flags: i }

- id: formatter
  title: Formato automático (Prettier o equivalente) sin diferencias
  category: quality
  level: required
  phase: foundation.setup
  since: "2026.10.2"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Nadie discute formato en los PR; los diffs muestran solo cambios reales."
  how: "Prettier (o Biome) con check en CI."
  verify:
    - { type: file_exists, path: [".prettierrc", ".prettierrc.json", ".prettierrc.js", ".prettierrc.mjs", "prettier.config.js", "prettier.config.mjs", "biome.json", "biome.jsonc"] }

- id: strict-lint
  title: "Lint estricto con 0 errores; complejidad ≤ 10, archivos ≤ 300 líneas, funciones ≤ 50 líneas"
  category: quality
  level: required
  phase: foundation.setup
  since: "2026.10.2"
  updated: "2026.10.3"
  effort: { size: S, hours: [1, 2] }
  why: "Los umbrales mantienen el código legible; el lint atrapa errores antes de producción."
  how: "ESLint (o Biome) con complexity, max-lines y max-lines-per-function en los umbrales del perfil (quality en profile.yaml). Relajarlos requiere razón: mep threshold <clave> <valor> <razón> --yes."
  verify:
    - { type: quality, rule: thresholds }
    - { type: command, run: "pnpm -s lint", timeout: 300 }

- id: strict-types
  title: "TypeScript strict y 0 any explícitos"
  category: quality
  level: required
  phase: foundation.setup
  since: "2026.10.2"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Los tipos estrictos atrapan una clase entera de errores sin escribir tests."
  how: "\"strict\": true en tsconfig; regla no-explicit-any."
  verify:
    - { type: json_key, file: tsconfig.json, key: compilerOptions.strict, value: true }
    - { type: grep, pattern: ":\\s*any\\b|<any>|as any\\b", glob: "{app,src,components,lib,hooks,services,utils}/**/*.{ts,tsx}", exclude: "**/*.d.ts", expect: absent }

- id: no-duplication-dead-code
  title: "Código duplicado ≤ 3% y 0 exports sin uso"
  category: quality
  level: required
  phase: foundation.setup
  since: "2026.10.2"
  effort: { size: S, hours: [1, 2] }
  why: "El duplicado se desincroniza; el código muerto confunde y pesa."
  how: "jscpd con umbral 3% y knip en CI."
  verify:
    - { type: grep, pattern: "\"jscpd\"|\"knip\"", glob: package.json }

- id: no-debug-leftovers
  title: "Sin console.log, código comentado ni TODO sin referencia (shortcut: de Ponytail permitido)"
  category: quality
  level: required
  phase: foundation.setup
  since: "2026.10.2"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Los restos de depuración ensucian la consola de producción y esconden trabajo pendiente."
  how: "Regla no-console; cada TODO con referencia (#123, ABC-12 o URL); los comentarios shortcut: los recolecta Ponytail."
  verify:
    - { type: grep, pattern: "console\\.log\\(", glob: "{app,src,components,lib,hooks,services,utils}/**/*.{ts,tsx,js,jsx}", expect: absent }
    - { type: grep, pattern: "\\b(TODO|FIXME|XXX)\\b(?!\\s*[(:]?\\s*(#\\d+|[A-Z][A-Z0-9]+-\\d+|https?://))", glob: "{app,src,components,lib,hooks,services,utils}/**/*.{ts,tsx,js,jsx}", expect: absent }

- id: code-maps
  title: "CODEMAP.md y REGISTRY.md existen y están al día"
  category: quality
  level: required
  phase: foundation.setup
  since: "2026.10.2"
  effort: { size: S, hours: [1, 2] }
  why: "Claude (y cualquiera) encuentra las cosas en un paso y reutiliza en lugar de duplicar."
  how: "mep codemap y mep registry; \"Para qué\" y \"No usar para\" en el comentario /** */ de cada export. Un export nuevo sin entrada bloquea."
  verify:
    - { type: maps, rule: codemap }
    - { type: maps, rule: registry }

- id: unit-tests
  title: Lógica de negocio con tests unitarios
  category: quality
  level: required
  phase: build.features
  since: "2026.10.2"
  effort: { size: M, hours: [3, 8], scales_with: entities }
  why: "Cálculos, permisos y validaciones son donde un error cuesta dinero."
  how: "Vitest (o el runner del stack) con tests de precios, permisos y validaciones; corre en CI."
  verify:
    - { type: file_exists, path: ["**/*.{test,spec}.{ts,tsx,js}"] }
    - { type: command, run: "pnpm -s test", timeout: 600 }

- id: test-coverage
  title: Cobertura mínima en lógica de negocio (ej. 70%)
  category: quality
  level: recommended
  phase: build.features
  since: "2026.10.2"
  effort: { size: S, hours: [1, 3] }
  why: "Un piso de cobertura evita que la lógica crítica quede sin probar."
  how: "Umbral de cobertura en la config de tests, solo sobre lógica de negocio."
  verify:
    - { type: grep, pattern: "thresholds|coverageThreshold", glob: "{vitest.config.{ts,mts,js},jest.config.{ts,js},package.json}" }

- id: quality-review
  title: Revisión de calidad antes de cerrar cada sub-etapa
  category: quality
  level: recommended
  phase: foundation.setup
  since: "2026.10.2"
  effort: { size: S, hours: [1, 2] }
  why: "Detecta duplicados, nombres confusos y oportunidades de reutilizar antes de que se acumulen."
  how: "/ponytail-review al cerrar (sus \"must fix\" bloquean); sin Ponytail, la revisión propia de /mep:phase close."
  verify:
    - { type: manual, prompt: "Revisión de calidad hecha al cerrar la última sub-etapa" }

- id: build-lint-typecheck
  title: Build, lint y type-check pasan
  category: deploy
  level: required
  phase: foundation.setup
  since: "2026.10.2"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Si no compila, no se despliega; el CI lo comprueba en cada PR."
  how: "Scripts build, lint y typecheck en package.json (typecheck: tsc --noEmit), corridos en CI."
  verify:
    - { type: json_key, file: package.json, key: scripts.build }
    - { type: json_key, file: package.json, key: scripts.typecheck }
    - { type: command, run: "pnpm -s typecheck", timeout: 300 }

