# Documentos de planeación en docs/plan/: Claude los escribe desde templates/plan/; el motor verifica que existan, que tengan sus secciones y que sigan al día con el código.

- id: plan-prd
  title: "PRD en docs/plan/PRD.md: qué se construye, para quién y cómo se mide"
  category: plan
  level: required
  phase: foundation.setup
  since: "2026.10.9"
  effort: { size: S, hours: [1, 3] }
  why: "Sin un PRD escrito, cada sesión reconstruye el producto de memoria y el cliente no tiene qué aprobar."
  how: "/mep:scope lo escribe desde templates/plan/PRD.md, con su diagrama journey o story-map hecho con diagram-design; cada trabajo a la medida del perfil aparece con su título."
