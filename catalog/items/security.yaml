# ── Agregados en 2026.11.3: revisión de seguridad antes de salir en vivo (mep prelaunch) ──

- id: password-reset-expiry
  title: "Los enlaces de recuperación de contraseña expiran (≤ 1 hora) y sirven una sola vez"
  category: security
  level: required
  phase: launch.ops
  since: "2026.11.3"
  when: { capabilities: [auth] }
  depends_on: [password-recovery]
  effort: { size: XS, hours: [0.5, 1.5] }
  why: "Un enlace de recuperación que no expira, o que sirve dos veces, es una llave de la cuenta olvidada en un correo: quien lo encuentre después puede entrar."
  how: "Token aleatorio, guardado con hash, válido 1 hora como máximo (Supabase: otp_expiry ≤ 3600 en la configuración de Auth). Se invalida al usarlo, al cambiar la contraseña y al pedir uno nuevo; la respuesta es la misma exista o no el correo, y cambiar la contraseña cierra las demás sesiones."
  verify:
    - { type: grep, pattern: "otp_expiry|expiresIn|expires_at|expiresAt|resetTokenExpires|passwordResetExpires|tokenExpir", glob: "**/*.{ts,tsx,js,jsx,toml,sql,py}" }
    - { type: manual, prompt: "El enlace de recuperación expira en una hora o menos, no sirve una segunda vez y se invalida al cambiar la contraseña" }
  references: ["https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html"]

- id: debug-mode-off
  title: "Modo debug apagado en producción: el detalle queda en logs privados y el usuario solo ve un mensaje"
  category: security
  level: required
  phase: launch.ops
  since: "2026.11.3"
  depends_on: [production-errors-hidden, error-monitoring]
  effort: { size: XS, hours: [0.5, 1] }
  why: "El modo debug muestra rutas, variables de entorno y consultas en la página de error: es el mapa que un atacante necesita. Los detalles sirven al equipo, no a quien visita."
  how: "NODE_ENV=production y sin DEBUG, APP_DEBUG ni debug: true en la configuración de producción (Dockerfile, vercel.json, variables del hosting). Un error le muestra al usuario un mensaje genérico con un código; el detalle (stack, contexto) va al monitoreo o a logs privados."
  verify:
    - { type: grep, pattern: "NODE_ENV\\s*=\\s*[\"']?development|^\\s*(APP_)?DEBUG(_MODE)?\\s*=\\s*[\"']?(true|1|\\*)|FLASK_DEBUG\\s*=\\s*1|\\bdebug:\\s*true", glob: "{Dockerfile*,docker-compose*.{yml,yaml},vercel.json,.env.production,.env.production.local,.github/workflows/*deploy*.{yml,yaml}}", flags: m, expect: absent }
    - { type: manual, prompt: "En producción un error muestra al usuario solo un mensaje genérico; el detalle queda en los logs privados o en el monitoreo" }

- id: unused-dependencies
  title: "Paquetes sin usar eliminados: cada dependencia instalada se importa en algún lado"
  category: security
  level: required
  phase: launch.ops
  since: "2026.11.3"
  when: { signals: { has_javascript: true } }
  depends_on: [no-critical-vulnerabilities]
  effort: { size: S, hours: [1, 2] }
  why: "Cada paquete que no se usa es código ajeno con acceso a tu servidor y una puerta más para una vulnerabilidad o un paquete comprometido; quitarlo cuesta un comando."
  how: "knip (modo dependencias) sin hallazgos: cada paquete de package.json se importa y cada import está declarado. Se corre antes de salir, junto con la auditoría de vulnerabilidades (pnpm audit) y la actualización de lo riesgoso."
  verify:
    - { type: grep, pattern: "\"knip\"", glob: "package.json" }
    - { type: command, run: "if [ -f pnpm-lock.yaml ]; then pnpm exec knip --dependencies; elif [ -f yarn.lock ]; then yarn knip --dependencies; else npx --no-install knip --dependencies; fi", timeout: 300 }
  references: ["https://knip.dev/"]

- id: secrets-history-clean
  title: "Historial de git sin llaves filtradas; las que aparezcan, rotadas"
  category: security
  level: required
  phase: launch.ops
  since: "2026.11.3"
  depends_on: [secrets-scan-ci, key-rotation-procedure]
  effort: { size: S, hours: [1, 3] }
  why: "Una llave que alguna vez se subió sigue en el historial aunque hoy no esté en los archivos: cualquiera que clone el repo la puede sacar. Borrarla no la invalida; solo rotarla lo hace."
  how: "gitleaks detect sobre todo el historial sin hallazgos (instalado en tu máquina; en CI ya corre con fetch-depth: 0). Si aparece una llave: rotarla en el proveedor de inmediato, poner la nueva en el gestor de variables y anotar la fecha en SECURITY.md; limpiar el historial con git filter-repo es opcional, la rotación no."
  verify:
    - { type: command, run: "gitleaks detect --source . --redact --no-banner", timeout: 300 }
    - { type: manual, prompt: "Si el historial tuvo llaves, cada una se rotó en su proveedor (borrarla del repo no basta) y la fecha de rotación quedó anotada en SECURITY.md" }
  references: ["https://github.com/gitleaks/gitleaks"]

- id: upload-type-allowlist
  title: "Solo los formatos permitidos se pueden subir: lista corta por uso, y nada de ejecutables, scripts ni HTML"
  category: security
  level: required
  phase: launch.ops
  since: "2026.11.3"
  when: { capabilities: [uploads] }
  depends_on: [upload-validation]
  effort: { size: S, hours: [1, 3] }
  why: "Un campo que acepta cualquier archivo acepta un .html con scripts, un .exe, un .svg con JavaScript o un .php disfrazado de foto. Decidir de antemano qué formatos entran es la defensa más barata."
  how: "Lista permitida (no lista de prohibidos) por tipo de uso: fotos = jpg, png, webp; documentos = pdf. Se comparan las tres cosas: la extensión, el tipo real por contenido (file-type) y el Content-Type declarado, y las tres deben coincidir con la lista. Se rechazan extensiones dobles (foto.php.jpg), nombres con rutas (../) y todo lo que no esté en la lista; el SVG, el HTML, los ejecutables y los comprimidos solo entran si el producto los necesita, y entonces con las reglas de upload-content-hardening. El mismo filtro en el cliente (accept) solo ayuda al usuario: la barrera es la del servidor."
  verify:
    - { type: grep, pattern: "allowedMimeTypes|allowed_mime_types|ALLOWED_(MIME|TYPES|EXTENSIONS)|acceptedFileTypes|allowedFileTypes|fileFilter|mimeTypes\\s*:", glob: "**/*.{ts,tsx,js,jsx,sql,toml}" }
    - { type: grep, pattern: "[\"']\\*/\\*[\"']|allowedMimeTypes\\s*[:=]\\s*\\[\\s*[\"']\\*", glob: "**/*.{ts,tsx,js,jsx,sql,toml}", expect: absent }
    - { type: manual, prompt: "Los formatos permitidos son una lista corta por tipo de uso; ejecutables, scripts, HTML y comprimidos no están, y extensión, tipo real y Content-Type deben coincidir" }
  references: ["https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html"]

- id: upload-content-hardening
  title: "El contenido de lo subido se trata como hostil: imágenes re-codificadas, SVG y PDF sin código activo, comprimidos con tope"
  category: security
  level: required
  phase: launch.ops
  since: "2026.11.3"
  when: { capabilities: [uploads] }
  depends_on: [upload-type-allowlist]
  effort: { size: M, hours: [2, 5] }
  why: "Un archivo puede tener el tipo correcto y llevar dentro algo más: una imagen que también es un script (políglota), un SVG con JavaScript, un PDF con acciones activas, un .zip que al abrirse ocupa gigas. La extensión y el tipo no lo dicen; el contenido sí."
  how: "Imágenes: decodificar y volver a codificar (sharp, Cloudinary) para descartar lo que no sea píxeles, con tope de ancho y alto. SVG: no aceptarlo o limpiarlo con DOMPurify/svgo y servirlo como descarga. PDF y Office: sin JavaScript ni macros, o solo como descarga. Comprimidos: tope de tamaño descomprimido, de número de archivos y de profundidad. Todo lo nuevo se escanea (antivirus) antes de publicarlo."
  verify:
    - { type: grep, pattern: "sharp\\(|jimp|cloudinary|imagemagick|libvips|from PIL|import PIL|pillow", glob: "**/*.{ts,tsx,js,jsx,py}", flags: i }
    - { type: manual, prompt: "Las imágenes se re-codifican, el SVG se rechaza o se limpia, los PDF y comprimidos tienen tope, y nada de esto se publica sin escanear" }

- id: upload-served-safely
  title: "Lo subido se sirve sin riesgo: otro origen, Content-Type propio, nosniff y descarga forzada si no es imagen"
  category: security
  level: required
  phase: launch.ops
  since: "2026.11.3"
  when: { capabilities: [uploads] }
  depends_on: [upload-validation]
  effort: { size: S, hours: [1, 2] }
  why: "Un archivo subido que el navegador abre desde tu propio dominio puede ejecutar código con los permisos de tu sitio (XSS almacenado). Servirlo desde otro origen y con el tipo correcto lo vuelve inofensivo."
  how: "Bucket o dominio aparte del sitio; el Content-Type sale del tipo validado, nunca del que mandó el usuario; X-Content-Type-Options: nosniff; Content-Disposition: attachment para todo lo que no sea imagen; nada de listar el bucket."
  verify:
    - { type: grep, pattern: "nosniff|Content-Disposition|contentDisposition|ResponseContentDisposition|download:\\s*true", glob: "**/*.{ts,tsx,js,jsx,json,toml}" }
    - { type: manual, prompt: "Lo subido se sirve desde un origen distinto al del sitio, con el Content-Type validado y nosniff, y como descarga si no es una imagen" }

# ── Ataques conocidos · una línea por técnica (a partir de 2026.11.5) ──────

- id: username-length-limits
  title: "Límites de longitud en usuario y contraseña (bcrypt corta a 72 bytes)"
  category: security
  level: required
  phase: build.features
  sensitive: [auth]
  since: "2026.11.5"
  when: { capabilities: [auth] }
  effort: { size: XS, hours: [0.5, 1] }
  why: "bcrypt ignora todo después de 72 bytes: dos contraseñas largas con el mismo inicio entran igual, y un usuario de 52+ caracteres puede chocar o desbordar un campo. Sin tope, una contraseña de 10 MB también es un DoS."
  how: "Tope explícito y igual en cliente, servidor y base de datos (p. ej. usuario ≤ 50, contraseña ≤ 128). Si usas bcrypt, prehash (SHA-256 + base64) o usa argon2."
  verify:
    - { type: manual, prompt: "Usuario y contraseña tienen un máximo validado en el servidor, y la longitud nunca se trunca en silencio" }

- id: jwt-algorithm-pinned
  title: "JWT: algoritmo fijado al verificar, nunca el que dice el token"
  category: security
  level: required
  phase: build.features
  sensitive: [auth]
  since: "2026.11.5"
  when: { capabilities: [auth] }
  effort: { size: XS, hours: [0.5, 1] }
  why: "Con confusión de algoritmo (alg: none, o RS256 → HS256 usando la llave pública como secreto) cualquiera fabrica un token válido."
  how: "Verificar con una lista fija de algoritmos y una llave por algoritmo; exigir exp, iss y aud; rechazar alg none. Mejor sesiones de servidor opacas si no necesitas JWT."
  verify:
    - { type: manual, prompt: "Cada verificación de JWT fija el algoritmo esperado y valida exp, iss y aud" }

- id: saml-signature-validation
  title: "SAML/SSO: firma validada sobre el elemento que se usa"
  category: security
  level: required
  phase: build.features
  sensitive: [auth]
  since: "2026.11.5"
  when: { capabilities: [auth] }
  effort: { size: M, hours: [2, 4] }
  why: "Los bypass de SAML mueven o duplican elementos firmados (wrapping) o aprovechan diferencias entre parsers para entrar como otra persona."
  how: "Librería mantenida, firma exigida sobre la Assertion completa, un solo Assertion/NameID, Audience, Destination y NotOnOrAfter validados, y IDs usados una sola vez. Si no usas SAML, no aplica."
  verify:
    - { type: manual, prompt: "Si hay SAML/SSO: firma, Audience y vigencia validadas con una librería mantenida; la identidad sale del elemento firmado" }

- id: oauth-immutable-identity
  title: "OAuth/OIDC: la identidad es el sub del proveedor, no el email (nOAuth)"
  category: security
  level: required
  phase: build.features
  sensitive: [auth]
  since: "2026.11.5"
  when: { capabilities: [auth] }
  effort: { size: S, hours: [1, 2] }
  why: "Un proveedor que deja cambiar el email (nOAuth) permite entrar a la cuenta de otra persona con solo declarar su correo."
  how: "Enlazar la cuenta con (proveedor, sub) inmutable; exigir email_verified y no fusionar cuentas solo por email sin confirmación."
  verify:
    - { type: manual, prompt: "Las cuentas con login social se enlazan por el id inmutable del proveedor, y no se fusionan por email sin verificar" }

- id: mfa-code-single-use
  title: "2FA: cada código se acepta una sola vez y expira rápido"
  category: security
  level: required
  phase: build.features
  sensitive: [auth]
  since: "2026.11.5"
  when: { capabilities: [auth] }
  effort: { size: S, hours: [1, 2] }
  why: "Un código TOTP o SMS que se puede repetir sirve a quien lo vio por encima o lo interceptó durante su ventana."
  how: "Guardar el último paso TOTP usado y rechazar repeticiones; ventana de ±1 paso; rate limit por cuenta; invalidar al usarse o al pedir otro."
  verify:
    - { type: manual, prompt: "Un código 2FA ya usado se rechaza, y los intentos tienen límite por cuenta" }

- id: tokens-csprng
  title: "Tokens y códigos con generador criptográfico, nunca Math.random"
  category: security
  level: required
  phase: build.features
  sensitive: [auth]
  since: "2026.11.5"
  when: { capabilities: [auth] }
  effort: { size: XS, hours: [0.5, 1] }
  why: "Math.random es predecible: tokens de reset, invitaciones o códigos generados con él se pueden adivinar."
  how: "crypto.randomUUID() / crypto.getRandomValues() / randomBytes con ≥128 bits; tokens guardados con hash."
  verify:
    - { type: manual, prompt: "Ningún token, código ni id secreto sale de Math.random o de un contador" }

- id: constant-time-compare
  title: "Comparar secretos en tiempo constante"
  category: security
  level: required
  phase: build.features
  sensitive: [auth]
  since: "2026.11.5"
  when: { capabilities: [auth] }
  effort: { size: XS, hours: [0.5, 1] }
  why: "Comparar con === revela, por el tiempo de respuesta, cuántos caracteres acertó el atacante (timing attack)."
  how: "timingSafeEqual / hmac.compare_digest para tokens, firmas de webhook y llaves; mismo tiempo y mensaje en login para usuario inexistente."
  verify:
    - { type: manual, prompt: "Tokens, firmas y llaves se comparan con una función de tiempo constante" }

- id: authenticated-encryption
  title: "Cifrado autenticado (AES-GCM) y errores uniformes: sin padding oracle"
  category: security
  level: required
  phase: build.features
  since: "2026.11.5"
  when: { signals: { has_db: true } }
  effort: { size: S, hours: [1, 2] }
  why: "CBC sin MAC con errores distintos para padding inválido deja descifrar datos byte por byte (padding oracle)."
  how: "AES-GCM o libsodium/secretbox; nunca inventar cifrado propio; ante cualquier fallo, un solo error genérico."
  verify:
    - { type: manual, prompt: "Si cifras datos: AES-GCM (o equivalente autenticado) y un solo error genérico al fallar" }

- id: request-smuggling
  title: "Proxy y servidor de origen interpretan igual cada petición (request smuggling)"
  category: security
  level: required
  phase: launch.ops
  since: "2026.11.5"
  effort: { size: S, hours: [1, 2] }
  why: "Si el proxy y el origen discrepan en dónde termina una petición (Content-Length vs Transfer-Encoding), un atacante cuela peticiones en la conexión de otras personas."
  how: "Hosting gestionado y actualizado; HTTP/2 hasta el origen; rechazar peticiones con Content-Length y Transfer-Encoding a la vez; no reutilizar conexiones hacia el origen con proxies viejos."
  verify:
    - { type: manual, prompt: "Proxy/CDN y origen están actualizados y rechazan peticiones ambiguas (Content-Length + Transfer-Encoding)" }

- id: http2-rapid-reset
  title: "HTTP/2: protección contra Rapid Reset y floods de streams"
  category: security
  level: required
  phase: launch.ops
  since: "2026.11.5"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Abrir y cancelar streams HTTP/2 sin parar tumba un servidor con muy poco tráfico (Rapid Reset, CVE-2023-44487)."
  how: "CDN/WAF delante con mitigación activa, servidor y runtime parcheados, límite de streams concurrentes."
  verify:
    - { type: manual, prompt: "El sitio está detrás de un CDN/WAF con mitigación HTTP/2 y el runtime está parcheado" }

- id: cache-poisoning
  title: "Caché: la llave incluye todo lo que cambia la respuesta (cache poisoning)"
  category: security
  level: required
  phase: launch.ops
  since: "2026.11.5"
  effort: { size: S, hours: [1, 2] }
  why: "Si la respuesta depende de un header que la caché no considera (X-Forwarded-Host, idioma, cookie), un atacante guarda una respuesta maliciosa para todos."
  how: "No reflejar headers sin llave en respuestas cacheables; Vary correcto; Cache-Control: private/no-store en lo personal; ignorar X-Forwarded-Host y X-Original-URL del cliente."
  verify:
    - { type: manual, prompt: "Lo personal no se cachea, y ningún header sin llave de caché cambia el contenido de una respuesta cacheable" }

- id: trusted-proxy-ip
  title: "La IP del cliente viene del proxy de confianza, no de un header falsificable"
  category: security
  level: required
  phase: build.features
  since: "2026.11.5"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Quien manda X-Forwarded-For propio salta el rate limit, el bloqueo por IP y los logs de auditoría."
  how: "Leer la IP que añade tu proxy/CDN (último salto de confianza) y descartar la que traiga el cliente; configurar trust proxy solo con el número real de saltos."
  verify:
    - { type: manual, prompt: "Rate limit y logs usan la IP puesta por el proxy de confianza, no X-Forwarded-For crudo" }

- id: regex-dos
  title: "Sin regex vulnerables a backtracking sobre datos del usuario (DeDoS)"
  category: security
  level: required
  phase: build.features
  since: "2026.11.5"
  effort: { size: S, hours: [1, 2] }
  why: "Una regex con cuantificadores anidados puede tardar minutos con una cadena corta y dejar el servidor sin responder."
  how: "Revisar regex nuevas (safe-regex, regexp-tree), limitar el largo del input antes de evaluarla, y usar RE2 o un parser en validaciones críticas."
  verify:
    - { type: manual, prompt: "Las regex que reciben datos del usuario no tienen backtracking exponencial y su entrada tiene un largo máximo" }

- id: graphql-limits
  title: "GraphQL: límites de profundidad, costo, alias/batching e introspección"
  category: security
  level: required
  phase: build.features
  since: "2026.11.5"
  effort: { size: S, hours: [1, 2] }
  why: "Los alias y las consultas por lote multiplican un intento de login o una consulta cara en una sola petición y saltan el rate limit."
  how: "Si hay GraphQL: límite de profundidad y de costo, tope de alias y de operaciones por lote, rate limit por operación, introspección apagada en producción y autorización por campo. Si no, no aplica."
  verify:
    - { type: manual, prompt: "Si hay GraphQL: profundidad, costo, alias y lotes tienen tope, y la introspección está apagada en producción" }

- id: websocket-origin-check
  title: "WebSocket: Origin validado y autenticación al conectar"
  category: security
  level: required
  phase: build.features
  sensitive: [auth]
  since: "2026.11.5"
  when: { capabilities: [realtime] }
  effort: { size: S, hours: [1, 2] }
  why: "Un sitio ajeno puede abrir un WebSocket con las cookies de la víctima (cross-site WebSocket hijacking) si el servidor no revisa el origen."
  how: "Validar el header Origin contra una lista permitida, autenticar con token en el handshake (no solo cookie) y revisar permisos en cada mensaje."
  verify:
    - { type: manual, prompt: "El servidor de WebSocket valida Origin y la identidad al conectar, y autoriza cada mensaje" }

- id: views-respect-rls
  title: "Vistas y funciones que respetan RLS (sin saltarse las políticas)"
  category: security
  level: required
  phase: build.data
  since: "2026.11.5"
  when: { signals: { has_db: true } }
  effort: { size: S, hours: [1, 2] }
  why: "En Postgres una vista corre con los permisos de su dueño: sin security_invoker, cualquiera que la consulte se salta el RLS de las tablas de abajo. Lo mismo con funciones SECURITY DEFINER."
  how: "create view … with (security_invoker = true); funciones SECURITY DEFINER solo con search_path fijo y revisando auth.uid(); probar con un usuario sin permisos."
  verify:
    - { type: manual, prompt: "Toda vista usa security_invoker (o no expone datos de otras personas) y las funciones SECURITY DEFINER validan quién llama" }

- id: prototype-pollution
  title: "Sin prototype pollution al mezclar objetos del usuario"
  category: security
  level: required
  phase: build.features
  since: "2026.11.5"
  when: { signals: { has_javascript: true } }
  effort: { size: XS, hours: [0.5, 1] }
  why: "Mezclar un JSON del usuario con merge/extend recursivo permite escribir en __proto__ y cambiar el comportamiento de toda la app."
  how: "Validar el JSON con un esquema (zod) antes de mezclarlo; bloquear __proto__, constructor y prototype; usar Map u Object.create(null); dependencias de merge actualizadas."
  verify:
    - { type: manual, prompt: "Los objetos del usuario se validan con esquema antes de mezclarse, y __proto__/constructor/prototype se rechazan" }

- id: template-injection
  title: "Sin inyección de plantillas: el input nunca se compila como plantilla"
  category: security
  level: required
  phase: build.features
  since: "2026.11.5"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Si el texto del usuario se interpreta como plantilla (Handlebars, Jinja, EJS, eval, new Function) ejecuta código en el servidor."
  how: "El input solo es dato que se inserta, nunca parte de la plantilla; plantillas de usuario (emails) en un motor sin lógica; sin eval ni new Function."
  verify:
    - { type: manual, prompt: "El texto del usuario solo entra como dato en las plantillas; no hay eval ni new Function con él" }

- id: xxe-disabled
  title: "Parsers XML sin entidades externas ni DTD (XXE)"
  category: security
  level: required
  phase: build.features
  since: "2026.11.5"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Un XML con una entidad externa hace que el servidor lea archivos locales (/etc/passwd, llaves) o llame a servicios internos."
  how: "Si procesas XML (SVG, SAML, RSS, docx, sitemaps): DTD y entidades externas desactivadas, o usar JSON. Si no procesas XML, no aplica."
  verify:
    - { type: manual, prompt: "Si se procesa XML: DTD y entidades externas desactivadas en el parser" }

- id: unicode-normalization
  title: "Unicode: normalizar y comparar bien usuarios y emails"
  category: security
  level: required
  phase: build.features
  sensitive: [auth]
  since: "2026.11.5"
  when: { capabilities: [auth] }
  effort: { size: S, hours: [1, 2] }
  why: "Caracteres que se ven iguales o que cambian al pasar a mayúsculas/minúsculas permiten registrar un usuario o email «idéntico» al de otra persona y tomar su cuenta o suplantarla."
  how: "Normalizar (NFKC) y pasar a minúsculas antes de guardar y de comparar; índice único sobre el valor normalizado; rechazar caracteres de control, invisibles y mezclas de alfabetos en nombres de usuario."
  verify:
    - { type: manual, prompt: "Usuarios y emails se normalizan (NFKC + minúsculas) antes de guardarse, con índice único sobre el valor normalizado" }
