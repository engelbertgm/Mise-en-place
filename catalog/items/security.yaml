# Seguridad por capas. Todo ítem de esta categoría se da por cumplido solo con su verify automático
# Y un reporte vigente de mep-security en .mep/security/<id>.json (ligado al hash de los archivos revisados).
# locked: no se puede desactivar. Un check `expect: absent` (o sql rls_enabled) que falla es una violación:
# en un ítem locked bloquea en cualquier momento, sin importar la fase.

# ── Secretos · siempre · locked ─────────────────────────────────────────────

- id: no-secrets-in-repo
  title: Cero secretos en el repo y en el bundle del cliente
  category: security
  level: required
  phase: foundation.setup
  locked: true
  since: "2026.10.1"
  effort: { size: S, hours: [1, 2] }
  why: "Una llave en el repo queda en el historial para siempre; cualquiera con acceso al código (o al bundle) la usa."
  how: "Secretos solo en el gestor de variables del hosting y en .env local ignorado. Si una llave se filtra: rotarla de inmediato (borrarla no basta)."
  verify:
    - { type: grep, pattern: '(?:-----BEGIN [A-Z ]*PRIVATE KEY-----)|(?:\b[sr]k_live_[0-9a-zA-Z]{16,})|(?:\bwhsec_[0-9a-zA-Z]{16,})|(?:\bsk-(?:proj-|ant-)?[A-Za-z0-9_-]{32,})|(?:\bAKIA[0-9A-Z]{16}\b)|(?:\bgh[pousr]_[A-Za-z0-9]{36,})|(?:\bxox[abposr]-[A-Za-z0-9-]{10,})|(?:\bAIza[0-9A-Za-z_-]{35}\b)|(?:\bre_[A-Za-z0-9]{8,}_[A-Za-z0-9]{16,})|(?:\bnpm_[A-Za-z0-9]{36}\b)|(?:"type":\s*"service_account")|(?:\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis)://[^\s:/@"'']+:[^\s@"''$]{3,}@)|(?:(?:NEXT_PUBLIC|VITE|PUBLIC)_[A-Z_]*SERVICE_ROLE)', glob: "**/*", exclude: "{**/.env,**/.env.local,**/.env.*.local,**/.env.development,**/.env.production,**/.env.test,**/*.lock,**/pnpm-lock.yaml,**/package-lock.json,**/*.{png,jpg,jpeg,gif,webp,avif,ico,svg,woff,woff2,ttf,pdf,zip,mp4,webm}}", expect: absent }
  references: ["https://owasp.org/Top10/A02_2021-Cryptographic_Failures/", "https://github.com/gitleaks/gitleaks"]

- id: env-gitignored
  title: ".env* en .gitignore (excepto .env.example)"
  category: security
  level: required
  phase: foundation.setup
  locked: true
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Es la forma más común de filtrar llaves: un .env.local versionado por accidente."
  how: ".gitignore con .env* y !.env.example; .env.example sin valores reales."
  verify:
    - { type: grep, pattern: "^\\.env", glob: .gitignore }
    - { type: grep, pattern: "=\\s*(sk_live_|sk_test_|whsec_|eyJ[A-Za-z0-9_-]{20,}|[A-Za-z0-9+/]{40,})", glob: .env.example, expect: absent }

- id: public-env-prefix
  title: "Al cliente solo llegan variables con prefijo público, y ninguna es secreta"
  category: security
  level: required
  phase: foundation.setup
  locked: true
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Todo lo que lleva NEXT_PUBLIC_, VITE_ o PUBLIC_ se incrusta en el JavaScript que descarga cualquiera."
  how: "Llaves privilegiadas (service_role de Supabase, secret key de Stripe) solo en servidor, sin prefijo público."
  verify:
    - { type: grep, pattern: "\\b(NEXT_PUBLIC|VITE|PUBLIC)_[A-Z0-9_]*(SECRET|SERVICE_ROLE|PRIVATE|PASSWORD|_TOKEN\\b|WEBHOOK)", glob: "**/*.{ts,tsx,js,jsx,mjs,astro,vue,svelte,json,example}", expect: absent }

- id: server-only-keys
  title: Llaves privilegiadas solo en código de servidor
  category: security
  level: required
  phase: build.features
  locked: true
  since: "2026.10.1"
  effort: { size: S, hours: [1, 2] }
  why: "Un import de servidor dentro de un componente de cliente filtra la llave al bundle."
  how: "Clientes con service_role o secret key en módulos con import \"server-only\"; nunca en archivos \"use client\" ni en components/."
  verify:
    - { type: grep, pattern: "SERVICE_ROLE|STRIPE_SECRET|SECRET_KEY|PRIVATE_KEY", glob: "{components,src/components,app/**/_components,src/hooks,hooks}/**/*.{ts,tsx,js,jsx}", expect: absent }
    - { type: manual, prompt: "Ningún archivo \"use client\" importa módulos con llaves privilegiadas" }

- id: secrets-scan-ci
  title: Escaneo de secretos en pre-commit y en CI, incluido el historial
  category: security
  level: required
  phase: foundation.setup
  since: "2026.10.1"
  effort: { size: S, hours: [1, 2] }
  why: "Detecta la llave antes de que llegue al remoto; el escaneo del historial encuentra las que ya se filtraron."
  how: "gitleaks (o trufflehog) en pre-commit y como job de CI con fetch-depth: 0."
  verify:
    - { type: grep, pattern: "gitleaks|trufflehog", glob: ".github/workflows/*.{yml,yaml}" }
    - { type: grep, pattern: "gitleaks|trufflehog|secretlint", glob: "{.husky/*,lefthook.{yml,yaml},.pre-commit-config.yaml,.lintstagedrc*,package.json}" }

- id: keys-per-environment
  title: Llaves distintas por entorno (desarrollo, preview, producción)
  category: security
  level: required
  phase: launch.ops
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Una llave de desarrollo filtrada no debe abrir producción."
  how: "Variables separadas por entorno en el gestor del hosting; modo test de Stripe fuera de producción."
  verify:
    - { type: manual, prompt: "Cada entorno usa sus propias llaves, guardadas en el gestor del hosting" }

- id: key-rotation-procedure
  title: Procedimiento de rotación de llaves documentado
  category: security
  level: required
  phase: launch.ops
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Cuando una llave se filtra cada minuto cuenta; sin procedimiento se improvisa."
  how: "SECURITY.md (o sección del README): dónde vive cada llave, cómo rotarla y a quién avisar."
  verify:
    - { type: grep, pattern: "rotaci[oó]n|rotat(e|ion)", glob: "{SECURITY.md,README.md,docs/**/*.md}", flags: i }

# ── Base · siempre ───────────────────────────────────────────────────────────

- id: canonical-redirects
  title: "Redirección canónica http→https y www↔sin-www"
  category: security
  level: required
  phase: launch.ops
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Una sola versión del dominio: sin contenido duplicado ni cookies servidas por HTTP."
  how: "Dominio principal en el hosting y redirección 308/301 desde las variantes."
  verify:
    - { type: manual, prompt: "http:// y la variante www (o sin www) redirigen al dominio canónico https://" }

- id: security-headers
  title: "Headers: X-Content-Type-Options, Referrer-Policy, frame-ancestors"
  category: security
  level: required
  phase: launch.ops
  since: "2026.10.1"
  effort: { size: S, hours: [1, 2] }
  why: "Evitan sniffing de tipos, fuga de URLs a terceros y clickjacking."
  how: "headers() en next.config: X-Content-Type-Options: nosniff, Referrer-Policy: strict-origin-when-cross-origin, CSP frame-ancestors 'self' (o X-Frame-Options: DENY)."
  verify:
    - { type: grep, pattern: "X-Content-Type-Options", glob: "{next.config.{js,mjs,ts},vercel.json,middleware.{ts,js},src/middleware.{ts,js},netlify.toml,public/_headers,astro.config.{mjs,ts}}" }
    - { type: grep, pattern: "Referrer-Policy", glob: "{next.config.{js,mjs,ts},vercel.json,middleware.{ts,js},src/middleware.{ts,js},netlify.toml,public/_headers,astro.config.{mjs,ts}}" }
    - { type: grep, pattern: "frame-ancestors|X-Frame-Options", glob: "{next.config.{js,mjs,ts},vercel.json,middleware.{ts,js},src/middleware.{ts,js},netlify.toml,public/_headers,astro.config.{mjs,ts}}" }

- id: lockfile-committed
  title: Lockfile versionado
  category: security
  level: required
  phase: foundation.setup
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Sin lockfile cada instalación puede traer versiones distintas, incluida una comprometida."
  how: "pnpm-lock.yaml (o el del gestor usado) en el repo; CI instala con --frozen-lockfile."
  verify:
    - { type: file_exists, path: [pnpm-lock.yaml, package-lock.json, yarn.lock, bun.lockb, bun.lock] }

- id: no-critical-vulnerabilities
  title: Sin vulnerabilidades críticas en dependencias
  category: security
  level: required
  phase: foundation.setup
  since: "2026.10.1"
  effort: { size: S, hours: [1, 3] }
  why: "Una dependencia con vulnerabilidad crítica conocida es la entrada más barata para un atacante."
  how: "pnpm audit --audit-level critical --prod limpio; actualizar o reemplazar lo que falle."
  verify:
    - { type: command, run: "if [ -f pnpm-lock.yaml ]; then pnpm audit --audit-level critical --prod; elif [ -f yarn.lock ]; then yarn npm audit --severity critical; else npm audit --audit-level=critical --omit=dev; fi", timeout: 120 }

- id: dependency-scan-ci
  title: Escaneo de dependencias en CI que falla con críticas
  category: security
  level: required
  phase: foundation.setup
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Las vulnerabilidades aparecen después de instalar; el CI las detecta en cada PR."
  how: "Paso de CI con pnpm audit (u OSV-Scanner). Revisar paquetes nuevos antes de instalarlos (typosquatting)."
  verify:
    - { type: grep, pattern: "\\baudit\\b|osv-scanner|socket", glob: ".github/workflows/*.{yml,yaml}" }

- id: production-errors-hidden
  title: Errores en producción sin stack traces ni detalles internos
  category: security
  level: required
  phase: launch.ops
  since: "2026.10.1"
  effort: { size: S, hours: [1, 2] }
  why: "Un stack trace revela rutas, versiones y consultas que guían un ataque."
  how: "Páginas de error genéricas; el detalle va al monitoreo de errores, nunca a la respuesta."
  verify:
    - { type: grep, pattern: "(error|err)\\.stack|JSON\\.stringify\\((error|err)\\)", glob: "{app,src/app,pages,src/pages}/**/{route,api,*.api}.{ts,js}", expect: absent }
    - { type: manual, prompt: "Las respuestas de error no exponen stack, SQL ni rutas internas" }

- id: csp-strict
  title: Content-Security-Policy estricta
  category: security
  level: recommended
  phase: launch.ops
  since: "2026.10.1"
  effort: { size: M, hours: [2, 6] }
  why: "Limita el daño de un XSS: el navegador no ejecuta scripts de orígenes no permitidos."
  how: "CSP con nonce (middleware de Next.js) y lista mínima de orígenes."
  verify:
    - { type: grep, pattern: "Content-Security-Policy", glob: "{next.config.{js,mjs,ts},vercel.json,middleware.{ts,js},src/middleware.{ts,js},netlify.toml,public/_headers}" }

- id: security-txt
  title: security.txt
  category: security
  level: recommended
  phase: launch.ops
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Dice a quien encuentra una vulnerabilidad cómo reportarla."
  how: "public/.well-known/security.txt con Contact y Expires."
  verify:
    - { type: route_exists, path: /.well-known/security.txt }
  references: ["https://securitytxt.org/"]

- id: dependency-updates-bot
  title: Dependabot o Renovate
  category: security
  level: recommended
  phase: foundation.setup
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Mantiene las dependencias al día con PRs pequeños y revisables."
  how: ".github/dependabot.yml o renovate.json."
  verify:
    - { type: file_exists, path: [.github/dependabot.yml, .github/dependabot.yaml, renovate.json, .github/renovate.json] }

# ── Ciberseguridad · siempre ─────────────────────────────────────────────────

- id: owasp-top10-review
  title: Checklist OWASP Top 10 revisado
  category: security
  level: required
  phase: build.features
  since: "2026.10.1"
  effort: { size: M, hours: [2, 6] }
  why: "Cubre las fallas más explotadas en aplicaciones web."
  how: "mep-security revisa cada punto del Top 10 contra el código y lo registra."
  verify:
    - { type: manual, prompt: "OWASP Top 10 revisado punto por punto" }
  references: ["https://owasp.org/Top10/"]

- id: no-sql-injection
  title: "Inyección: consultas parametrizadas u ORM; nunca SQL armado con strings"
  category: security
  level: required
  phase: build.data
  since: "2026.10.1"
  when: { signals: { has_db: true } }
  effort: { size: S, hours: [1, 2] }
  why: "SQL concatenado con datos del usuario permite leer o borrar la base completa."
  how: "Cliente de Supabase, Drizzle o Prisma con parámetros; prohibido $queryRawUnsafe y template strings en query()."
  verify:
    - { type: grep, pattern: "\\$(query|execute)RawUnsafe|\\b(query|execute)\\(\\s*`[^`]*\\$\\{|\\b(query|execute)\\(\\s*[\"'][^\"']*[\"']\\s*\\+", glob: "**/*.{ts,tsx,js,jsx,mjs}", expect: absent }

- id: no-raw-html
  title: "XSS: nada de HTML crudo sin sanitizar"
  category: security
  level: required
  phase: build.features
  since: "2026.10.1"
  effort: { size: S, hours: [1, 2] }
  why: "HTML del usuario sin sanitizar ejecuta scripts en el navegador de otros usuarios."
  how: "Renderizar texto, no HTML. Si hace falta HTML: DOMPurify. JSON-LD con JSON.stringify es la excepción permitida."
  verify:
    - { type: grep, pattern: "^(?!.*(DOMPurify|sanitize|JSON\\.stringify)).*(dangerouslySetInnerHTML|v-html=|\\.innerHTML\\s*=|set:html=)", glob: "**/*.{tsx,jsx,ts,js,vue,svelte,astro}", expect: absent }

- id: safe-redirects
  title: "Redirecciones abiertas: parámetros de redirect contra lista permitida"
  category: security
  level: required
  phase: build.features
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Un ?next= sin validar convierte tu dominio en un enlace de phishing creíble."
  how: "Aceptar solo rutas relativas propias (empiezan con / y no con //) o dominios de una lista."
  verify:
    - { type: grep, pattern: "redirect\\(\\s*(searchParams|req\\.query|params|query)\\b|location\\.href\\s*=\\s*(searchParams|params|query)", glob: "**/*.{ts,tsx,js,jsx}", expect: absent }
    - { type: manual, prompt: "Todo parámetro de redirect se valida contra la lista permitida" }

- id: ssrf-allowlist
  title: "SSRF: si el servidor descarga URLs del usuario, lista permitida de dominios"
  category: security
  level: required
  phase: build.features
  since: "2026.10.1"
  effort: { size: S, hours: [1, 2] }
  why: "Un fetch a una URL del usuario puede alcanzar servicios internos o metadatos del hosting."
  how: "Si existe esa función: lista de dominios permitidos, sin IPs privadas ni redirecciones. Si no existe, la auditoría lo registra como no aplica."
  verify:
    - { type: manual, prompt: "Ningún fetch del servidor usa una URL del usuario sin lista permitida" }

- id: logs-without-secrets
  title: Logs sin contraseñas, tokens ni datos personales
  category: security
  level: required
  phase: build.features
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Los logs los leen más personas y servicios que la base de datos."
  how: "Loggear IDs, no valores; redactar password, token, authorization y email."
  verify:
    - { type: grep, pattern: "console\\.(log|info|debug|warn|error)\\([^)]*\\b(password|passwd|token|secret|apiKey|api_key|authorization)\\b", glob: "**/*.{ts,tsx,js,jsx}", flags: i, expect: absent }

- id: static-analysis-ci
  title: Análisis estático en CI (Semgrep o CodeQL)
  category: security
  level: recommended
  phase: foundation.setup
  since: "2026.10.1"
  effort: { size: S, hours: [1, 2] }
  why: "Encuentra patrones inseguros en cada PR sin depender de la memoria del revisor."
  how: "Job de CodeQL o Semgrep en GitHub Actions."
  verify:
    - { type: grep, pattern: "codeql|semgrep", glob: ".github/workflows/*.{yml,yaml}", flags: i }

- id: waf-ddos
  title: Firewall/WAF del hosting y protección DDoS
  category: security
  level: recommended
  phase: launch.ops
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Frena bots, fuerza bruta y picos maliciosos antes de que lleguen a la app."
  how: "Vercel Firewall (o equivalente) con reglas para login, API y rate limit global."
  verify:
    - { type: manual, prompt: "WAF del hosting configurado" }

- id: pentest-before-launch
  title: Pentest antes de lanzar
  category: security
  level: recommended
  phase: launch.ops
  since: "2026.10.1"
  level_overrides:
    - { when: { any: [ { capabilities: [payments] }, { audience: { any: [sensitive-data-health, sensitive-data-finance] } } ] }, level: required }
  effort: { size: L, hours: [8, 20] }
  why: "Una revisión externa encuentra lo que el equipo ya no ve."
  how: "Pentest (interno o de terceros) sobre staging con datos ficticios; hallazgos críticos resueltos antes de lanzar."
  verify:
    - { type: manual, prompt: "Pentest realizado y hallazgos críticos resueltos" }

