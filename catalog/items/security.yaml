# ── Usuarios · si auth ───────────────────────────────────────────────────────

- id: password-hashing
  title: Contraseñas con argon2 o bcrypt
  category: security
  level: required
  phase: build.data
  locked: true
  since: "2026.10.1"
  when: { capabilities: [auth] }
  effort: { size: XS, hours: [0.5, 1] }
  why: "Un hash rápido (md5, sha) se revierte con fuerza bruta en minutos si la base se filtra."
  how: "Auth gestionada (Supabase Auth) o argon2id/bcrypt; nunca md5, sha1 ni sha256 para contraseñas."
  verify:
    - { type: grep, pattern: "\"(argon2|@node-rs/argon2|bcrypt|bcryptjs|@node-rs/bcrypt|@supabase/ssr|@supabase/supabase-js|next-auth|@auth/core|better-auth|@clerk/nextjs|lucia)\"", glob: package.json }
    - { type: grep, pattern: "createHash\\([\"'](md5|sha1|sha256)[\"']\\)[^\\n]*(password|passwd|pwd)|(md5|sha1)\\([^)]*(password|passwd|pwd)", glob: "**/*.{ts,tsx,js,jsx}", flags: i, expect: absent }

- id: secure-session-cookies
  title: "Cookies de sesión HttpOnly + Secure + SameSite"
  category: security
  level: required
  phase: build.features
  since: "2026.10.1"
  when: { capabilities: [auth] }
  effort: { size: XS, hours: [0.5, 1] }
  why: "Una cookie legible por JavaScript se roba con un XSS; sin SameSite, se envía en peticiones de otros sitios."
  how: "httpOnly: true, secure: true, sameSite: 'lax' (Supabase SSR lo configura así)."
  verify:
    - { type: grep, pattern: "httpOnly:\\s*false|sameSite:\\s*[\"']none[\"']", glob: "**/*.{ts,tsx,js,jsx}", flags: i, expect: absent }
    - { type: manual, prompt: "Cookies de sesión con HttpOnly, Secure y SameSite" }

- id: csrf-protection
  title: Protección CSRF
  category: security
  level: required
  phase: build.features
  since: "2026.10.1"
  when: { capabilities: [auth] }
  effort: { size: S, hours: [1, 2] }
  why: "Sin CSRF otro sitio puede ejecutar acciones con la sesión del usuario."
  how: "Server Actions (verifican Origin), SameSite=Lax y token o verificación de Origin en route handlers que mutan."
  verify:
