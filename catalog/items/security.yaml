- id: owasp-top10-review
  title: Checklist OWASP Top 10 revisado
  category: security
  level: required
  phase: build.features
  since: "2026.10.1"
  effort: { size: M, hours: [2, 6] }
  why: "Cubre las fallas más explotadas en aplicaciones web."
  how: "mep-security revisa cada punto del Top 10 contra el código y lo registra."
  verify:
    - { type: manual, prompt: "OWASP Top 10 revisado punto por punto" }
  references: ["https://owasp.org/Top10/"]

- id: no-sql-injection
  title: "Inyección: consultas parametrizadas u ORM; nunca SQL armado con strings"
  category: security
  level: required
  phase: build.data
  sensitive: [db]
  since: "2026.10.1"
  when: { signals: { has_db: true } }
  effort: { size: S, hours: [1, 2] }
  why: "SQL concatenado con datos del usuario permite leer o borrar la base completa."
  how: "Cliente de Supabase, Drizzle o Prisma con parámetros; prohibido $queryRawUnsafe y template strings en query()."
  verify:
    - { type: grep, pattern: "\\$(query|execute)RawUnsafe|\\b(query|execute)\\(\\s*`[^`]*\\$\\{|\\b(query|execute)\\(\\s*[\"'][^\"']*[\"']\\s*\\+", glob: "**/*.{ts,tsx,js,jsx,mjs}", expect: absent }

- id: no-raw-html
  title: "XSS: nada de HTML crudo sin sanitizar"
  category: security
  level: required
  phase: build.features
  since: "2026.10.1"
  effort: { size: S, hours: [1, 2] }
  why: "HTML del usuario sin sanitizar ejecuta scripts en el navegador de otros usuarios."
  how: "Renderizar texto, no HTML. Si hace falta HTML: DOMPurify. JSON-LD con JSON.stringify es la excepción permitida."
  verify:
    - { type: grep, pattern: "^(?!.*(DOMPurify|sanitize|JSON\\.stringify)).*(dangerouslySetInnerHTML|v-html=|\\.innerHTML\\s*=|set:html=)", glob: "**/*.{tsx,jsx,ts,js,vue,svelte,astro}", expect: absent }

- id: safe-redirects
  title: "Redirecciones abiertas: parámetros de redirect contra lista permitida"
  category: security
  level: required
  phase: build.features
  sensitive: [config]
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Un ?next= sin validar convierte tu dominio en un enlace de phishing creíble."
  how: "Aceptar solo rutas relativas propias (empiezan con / y no con //) o dominios de una lista."
  verify:
    - { type: grep, pattern: "redirect\\(\\s*(searchParams|req\\.query|params|query)\\b|location\\.href\\s*=\\s*(searchParams|params|query)", glob: "**/*.{ts,tsx,js,jsx}", expect: absent }
    - { type: manual, prompt: "Todo parámetro de redirect se valida contra la lista permitida" }

- id: ssrf-allowlist
  title: "SSRF: si el servidor descarga URLs del usuario, lista permitida de dominios"
  category: security
  level: required
  phase: build.features
  since: "2026.10.1"
  effort: { size: S, hours: [1, 2] }
  why: "Un fetch a una URL del usuario puede alcanzar servicios internos o metadatos del hosting."
  how: "Si existe esa función: lista de dominios permitidos, sin IPs privadas ni redirecciones. Si no existe, la auditoría lo registra como no aplica."
  verify:
    - { type: manual, prompt: "Ningún fetch del servidor usa una URL del usuario sin lista permitida" }

- id: logs-without-secrets
  title: Logs sin contraseñas, tokens ni datos personales
  category: security
  level: required
  phase: build.features
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Los logs los leen más personas y servicios que la base de datos."
  how: "Loggear IDs, no valores; redactar password, token, authorization y email."
  verify:
    - { type: grep, pattern: "console\\.(log|info|debug|warn|error)\\([^)]*\\b(password|passwd|token|secret|apiKey|api_key|authorization)\\b", glob: "**/*.{ts,tsx,js,jsx}", flags: i, expect: absent }

- id: static-analysis-ci
  title: Análisis estático en CI (Semgrep o CodeQL)
  category: security
  level: recommended
  phase: foundation.setup
  since: "2026.10.1"
  effort: { size: S, hours: [1, 2] }
  why: "Encuentra patrones inseguros en cada PR sin depender de la memoria del revisor."
  how: "Job de CodeQL o Semgrep en GitHub Actions."
  verify:
    - { type: grep, pattern: "codeql|semgrep", glob: ".github/workflows/*.{yml,yaml}", flags: i }

- id: waf-ddos
  title: Firewall/WAF del hosting y protección DDoS
  category: security
  level: recommended
  phase: launch.ops
  since: "2026.10.1"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Frena bots, fuerza bruta y picos maliciosos antes de que lleguen a la app."
  how: "Vercel Firewall (o equivalente) con reglas para login, API y rate limit global."
  verify:
    - { type: manual, prompt: "WAF del hosting configurado" }

- id: pentest-before-launch
  title: Pentest antes de lanzar
  category: security
  level: recommended
  phase: launch.ops
  since: "2026.10.1"
  level_overrides:
    - { when: { any: [ { capabilities: [payments] }, { audience: { any: [sensitive-data-health, sensitive-data-finance] } } ] }, level: required }
  effort: { size: L, hours: [8, 20] }
