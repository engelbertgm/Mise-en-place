# ── Base de datos · si hay DB ────────────────────────────────────────────────

- id: rls-all-tables
  title: RLS activo en todas las tablas
  category: security
  level: required
  phase: build.data
  locked: true
  since: "2026.10.1"
  when: { signals: { has_db: true, db_client_access: true } }
  effort: { size: M, hours: [2, 6], scales_with: entities }
  why: "Con acceso directo desde el cliente (Supabase), una tabla sin RLS es pública para cualquiera con la anon key."
  how: "Cada create table en migraciones va con su enable row level security. Advisors de Supabase sin alertas."
  verify:
    - { type: sql, rule: rls_enabled }

- id: rls-policies-per-operation
  title: Políticas RLS separadas por operación + tests A no ve datos de B
  category: security
  level: required
  phase: build.data
  since: "2026.10.1"
  depends_on: [rls-all-tables]
  when: { signals: { has_db: true, db_client_access: true } }
  effort: { size: M, hours: [3, 8], scales_with: entities }
  why: "Una política \"for all\" mezcla permisos; los tests prueban que el aislamiento funciona de verdad."
  how: "create policy por select, insert, update y delete; tests de políticas con dos usuarios."
  verify:
    - { type: sql, rule: policies_per_operation }
    - { type: manual, prompt: "Tests: el usuario A no puede leer ni modificar datos del usuario B" }

- id: db-least-privilege
  title: Usuario de DB de la app con privilegios mínimos
  category: security
  level: required
  phase: build.data
  since: "2026.10.1"
  when: { signals: { has_db: true } }
  effort: { size: XS, hours: [0.5, 1] }
  why: "Si la app se compromete, el atacante solo puede lo que puede su usuario de DB."
  how: "Rol de la app sin superuser ni DDL; las migraciones corren con otro rol."
  verify:
    - { type: manual, prompt: "La app se conecta con un rol sin privilegios de administración" }

- id: db-ssl
  title: Conexión cifrada (SSL) a la base de datos
  category: security
  level: required
  phase: build.data
  since: "2026.10.1"
  when: { signals: { has_db: true } }
  effort: { size: XS, hours: [0.5, 1] }
  why: "Sin SSL las consultas y credenciales viajan en claro."
  how: "sslmode=require en la connection string; nunca ssl: false."
