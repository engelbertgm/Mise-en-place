- id: form-input-masks
  title: Máscaras de formato que no bloquean la escritura
  category: forms
  level: recommended
  phase: build.ux
  since: "2026.10.2"
  when: { signals: { has_forms: true } }
  effort: { size: S, hours: [1, 2] }
  why: "Formatear teléfono o tarjeta ayuda, pero bloquear teclas frustra."
