- id: search-url-query
  title: "Búsqueda: consulta en la URL (?q=), debounce y estado sin resultados con sugerencias"
  category: data
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: [search] }
  effort: { size: M, hours: [2, 5] }
  why: "La búsqueda se comparte y sobrevive al recargar; el debounce evita una consulta por tecla."
  how: "?q= como fuente de verdad, debounce 200–300 ms, \"sin resultados\" con sugerencias o búsquedas populares."
  verify:
    - { type: grep, pattern: "[\"']q[\"']|\\?q=|searchParams\\.get\\([\"']q", glob: "**/*.{tsx,jsx,ts}" }
    - { type: grep, pattern: "debounce|useDebounce|useDeferredValue", glob: "**/*.{tsx,jsx,ts}" }

- id: search-typo-tolerance
  title: Tolerancia a errores de escritura y resaltado de coincidencias
  category: data
  level: required
  phase: build.features
  since: "2026.10.2"
  when: { capabilities: [search] }
  effort: { size: M, hours: [2, 6] }
  why: "La gente escribe mal; una búsqueda exacta devuelve vacío y se pierde la venta."
  how: "Motor con fuzzy (Postgres pg_trgm, Meilisearch, Algolia) y resaltado de la coincidencia."
  verify:
    - { type: grep, pattern: "pg_trgm|similarity\\(|fuzzy|typoTolerance|meilisearch|algolia|fuse\\.js|<mark", glob: "**/*.{ts,tsx,sql,json}" }

- id: search-shortcut
  title: "Atajo de teclado (⌘K / Ctrl+K) y búsquedas recientes"
  category: data
  level: recommended
  phase: build.ux
  since: "2026.10.2"
  when: { capabilities: [search] }
  effort: { size: S, hours: [1, 3] }
  why: "Los usuarios frecuentes buscan sin tocar el mouse."
  how: "CommandDialog (cmdk) con ⌘K y lista de búsquedas recientes."
  verify:
    - { type: grep, pattern: "cmdk|CommandDialog|metaKey.*[\"']k[\"']", glob: "**/*.{tsx,jsx,ts,json}" }
