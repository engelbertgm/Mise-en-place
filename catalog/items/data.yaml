# Datos y tablas (si hay listados) y búsqueda (si search).

- id: table-url-state
  title: "Paginación, filtros, orden y búsqueda guardados en la URL"
  category: data
  level: required
  phase: build.ux
  since: "2026.10.2"
  when: { signals: { has_tables: true } }
  effort: { size: M, hours: [2, 5], scales_with: entities }
  why: "La vista se puede compartir, sobrevive al recargar y el botón atrás funciona."
  how: "searchParams como fuente de verdad (nuqs o useSearchParams); nada de estado local para filtros."
  verify:
    - { type: grep, pattern: "nuqs|useQueryState|useSearchParams|searchParams", glob: "**/*.{tsx,jsx,ts}" }

- id: table-states
  title: "Estados de tabla: cargando (skeleton), vacío, sin resultados con filtros (con limpiar filtros), error"
  category: data
  level: required
  phase: build.ux
  since: "2026.10.2"
  when: { signals: { has_tables: true } }
  effort: { size: S, hours: [1, 3] }
  why: "\"Sin resultados\" y \"vacío\" son distintos: uno se arregla limpiando filtros, el otro creando algo."
  how: "Skeleton de tabla, EmptyState con acción, estado sin resultados con botón \"Limpiar filtros\", error con reintentar."
  verify:
    - { type: grep, pattern: "Limpiar filtros|Clear filters|resetFilters|clearFilters", glob: "**/*.{tsx,jsx,json}" }

- id: table-sticky-header
