# Estados, feedback, motion y principios de UX/UI: 🔴 siempre.

- id: data-view-states
  title: "Cada vista con datos tiene 4 estados: cargando, vacío, error con reintento, con datos"
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.2"
  when: { signals: { has_db: true } }
  effort: { size: M, hours: [2, 6], scales_with: entities }
  why: "Una vista que solo contempla \"con datos\" se ve rota al cargar, al estar vacía o al fallar."
  how: "loading.tsx o Suspense con skeleton, EmptyState con acción, error.tsx con botón de reintentar."
  verify:
    - { type: file_exists, path: ["{app,src/app}/**/loading.{tsx,jsx}", "{app,src/app}/**/error.{tsx,jsx}"] }
    - { type: grep, pattern: "reset\\(\\)|Reintentar|Try again|retry", glob: "**/*.{tsx,jsx}" }

- id: skeletons
  title: Skeletons con la forma del contenido real
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.2"
  effort: { size: S, hours: [1, 3] }
  why: "Un skeleton con la forma real reduce la espera percibida y evita saltos de layout; un spinner genérico no."
  how: "Skeletons por patrón (tabla, card, lista, perfil) del sistema de diseño; nada de spinners en layouts."
  verify:
    - { type: grep, pattern: "Skeleton", glob: "**/*.{tsx,jsx,astro,vue,svelte}" }

- id: page-progress-bar
  title: Barra de progreso en navegación entre páginas
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.2"
  effort: { size: XS, hours: [0.5, 1] }
  why: "Sin señal, el usuario cree que el clic no funcionó y vuelve a hacer clic."
  how: "Barra superior (nextjs-toploader, @bprogress o useLinkStatus) con el color de acento."
  verify:
    - { type: grep, pattern: "nextjs-toploader|@bprogress|nprogress|TopLoader|useLinkStatus|ProgressBar", glob: "**/*.{tsx,jsx,ts,json}" }

- id: real-progress
  title: Progreso real (%) en operaciones largas
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.2"
  when: { capabilities: { any: [uploads, media, ai-features] } }
  effort: { size: S, hours: [1, 3] }
  why: "En uploads, exports o procesos largos, un porcentaje real evita que el usuario abandone."
  how: "Barra con porcentaje de onUploadProgress o del proceso; tiempo restante si se conoce."
  verify:
    - { type: grep, pattern: "onUploadProgress|progress|Progress", glob: "**/*.{tsx,jsx,ts}" }

- id: pending-buttons
  title: Botones con estado pendiente y bloqueo de doble envío
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.2"
  when: { signals: { has_forms: true } }
  effort: { size: S, hours: [1, 2] }
  why: "Sin estado pendiente el usuario hace clic dos veces: pedidos y pagos duplicados."
  how: "useFormStatus/isPending: el botón se deshabilita y muestra que está trabajando en < 100 ms."
  verify:
    - { type: grep, pattern: "useFormStatus|isPending|isSubmitting|pending\\b", glob: "**/*.{tsx,jsx}" }

- id: optimistic-ui
  title: UI optimista donde se pueda revertir, con rollback
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.2"
  when: { signals: { has_db: true } }
  effort: { size: M, hours: [2, 5] }
  why: "Likes, toggles y ediciones se sienten instantáneos aunque el servidor tarde (ley de Doherty)."
  how: "useOptimistic u onMutate; si falla, revertir y avisar con toast."
  verify:
    - { type: grep, pattern: "useOptimistic|onMutate|optimistic", glob: "**/*.{tsx,jsx,ts}" }

- id: toasts
  title: Toasts para confirmar acciones y para errores
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.2"
  when: { signals: { has_forms: true } }
  effort: { size: XS, hours: [0.5, 1] }
  why: "Confirma que algo pasó (o falló) sin mover al usuario de donde está."
  how: "Sonner (shadcn) con mensajes que dicen qué pasó."
  verify:
    - { type: grep, pattern: "sonner|toast\\(|useToast", glob: "**/*.{tsx,jsx,ts}" }

- id: live-dropzone
  title: "Dropzone viva: reposo, arrastrando encima, subiendo, éxito o error por archivo"
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.2"
  when: { capabilities: [uploads] }
  effort: { size: M, hours: [3, 6] }
  why: "Sin cambio visual al arrastrar, el usuario no sabe si puede soltar; sin estado por archivo, no sabe qué falló."
  how: "Componente Dropzone del sistema con los cinco estados y progreso por archivo."
  verify:
    - { type: grep, pattern: "Dropzone|useDropzone|onDragOver|isDragActive", glob: "**/*.{tsx,jsx}" }

- id: inline-validation
  title: Validación en línea al salir del campo
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.2"
  when: { signals: { has_forms: true } }
  effort: { size: S, hours: [1, 2] }
  why: "Corregir al momento es más fácil que descubrir cinco errores al enviar."
  how: "Validar en blur; tras el primer error, revalidar en cada tecla (ver form-validation-timing)."
  verify:
    - { type: grep, pattern: "mode:\\s*[\"']onTouched[\"']|mode:\\s*[\"']onBlur[\"']|onBlur=", glob: "**/*.{tsx,jsx,ts}" }

- id: motion-transitions
  title: "Transiciones en aperturas, cierres, cambios de estado y entrada de listas (150–300 ms desde tokens)"
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.2"
  depends_on: [a11y-reduced-motion]
  effort: { size: S, hours: [1, 3] }
  why: "El movimiento explica de dónde viene y a dónde va cada cosa; sin él, los cambios son bruscos."
  how: "Modales, menús y acordeones con transición; duraciones y curvas desde tokens; reducidas con prefers-reduced-motion."
  verify:
    - { type: grep, pattern: "--duration|transitionDuration|duration-(fast|normal|slow|\\d+)", glob: "**/*.{css,scss,ts,js,tsx}" }

- id: ux-laws
  title: "Leyes de UX aplicadas (Doherty, Fitts, Hick, Miller, Jakob, Gestalt, Von Restorff, Tesler, Goal-gradient, Peak-end)"
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.2"
  effort: { size: M, hours: [2, 6] }
  why: "Son la forma más barata de que la interfaz se sienta obvia: respuesta < 400 ms, objetivos ≥ 44 px, pocas opciones por decisión, un CTA principal por vista, patrones conocidos, progreso visible, finales cuidados."
  how: "Revisar cada vista clave contra la lista antes de cerrar build.ux."
  verify:
    - { type: manual, prompt: "Vistas clave revisadas contra las leyes de UX (objetivos ≥ 44 px, un CTA principal, progreso visible, finales de flujo cuidados)" }
  references: ["https://lawsofux.com/"]

- id: ui-principles
  title: "Principios de UI aplicados (jerarquía, retícula, escala, largo de línea, espacio en blanco, 60-30-10, Gestalt, affordances, consistencia, Nielsen)"
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.2"
  effort: { size: M, hours: [2, 6] }
  why: "Se entiende qué leer primero, todo alinea, el acento marca acciones y lo clicable parece clicable."
  how: "Revisar cada vista clave: retícula, largo de línea 60–80 caracteres, acento solo en acciones, deshacer/cancelar, prevención de errores."
  verify:
    - { type: manual, prompt: "Vistas clave revisadas contra los principios de UI y las heurísticas de Nielsen" }
  references: ["https://www.nngroup.com/articles/ten-usability-heuristics/"]

# ── Agregados en 2026.10.5: conversión ──

- id: cta-above-fold
  title: "CTA principal visible sin hacer scroll, en móvil y escritorio"
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.5"
  when: { type: { any: [landing, corporate, local-business, ecommerce, saas, marketplace, booking, portfolio] } }
  effort: { size: S, hours: [1, 2] }
  why: "Quien llega debe saber qué hacer en el primer vistazo; un CTA escondido bajo el pliegue pierde la mayor parte de la conversión."
  how: "Un solo CTA principal en el primer viewport (360 y 1280 px), marcado con data-cta=\"primary\"; el test responsive comprueba que está a la vista."
  verify:
    - { type: grep, pattern: "data-cta=[\"']primary[\"']", glob: "**/*.{tsx,jsx,astro,vue,svelte,html}" }
    - { type: command, run: "pnpm run test:responsive", timeout: 600 }

- id: sticky-mobile-cta
  title: "CTA fijo en móvil en páginas largas"
  category: ux
  level: recommended
  phase: build.ux
  since: "2026.10.5"
  when: { type: { any: [landing, local-business, ecommerce, booking, corporate] } }
  level_overrides:
    - { when: { type: landing }, level: required }
  effort: { size: S, hours: [1, 2] }
  why: "En móvil, el CTA del inicio desaparece al bajar; una barra fija lo mantiene a un toque mientras el usuario decide."
  how: "Barra inferior solo en móvil (md:hidden) con el CTA principal, que aparece tras el primer scroll, respeta env(safe-area-inset-bottom) y no tapa contenido (padding inferior en el body)."
  verify:
    - { type: grep, pattern: "data-cta=[\"']sticky[\"']|(fixed|sticky)[^\"']*bottom-0[^\"']*md:hidden|md:hidden[^\"']*(fixed|sticky)[^\"']*bottom-0", glob: "**/*.{tsx,jsx,astro,vue,svelte,html}" }
    - { type: grep, pattern: "safe-area-inset-bottom", glob: "**/*.{tsx,jsx,css,scss,astro}" }

- id: form-thank-you
  title: "Página o estado de gracias tras enviar un formulario"
  category: ux
  level: required
  phase: build.ux
  since: "2026.10.5"
  when: { signals: { has_forms: true } }
  effort: { size: S, hours: [1, 2] }
  why: "Confirma que el envío llegó, dice qué sigue (\"te respondemos en 24 h\") y es el punto donde se mide la conversión."
  how: "Ruta /gracias (o estado de éxito en la misma vista) con mensaje, siguiente paso y evento de conversión en analytics."
  verify:
    - { type: file_exists, path: ["{app,src/app}/**/{gracias,thank-you,thanks,obrigado,merci,danke}/page.{tsx,jsx,mdx}", "src/pages/{gracias,thank-you,thanks}.{astro,md,mdx,tsx}"] }

# ── Agregados en 2026.11.1: patrones de interacción ──

- id: command-menu
  title: "Menú de comandos (⌘K / Ctrl+K) para ir a cualquier vista y ejecutar acciones"
  category: ux
  level: recommended
  phase: build.ux
  since: "2026.11.1"
  when: { any: [ { type: { any: [saas, internal-app] } }, { capabilities: [admin-panel] } ] }
  effort: { size: S, hours: [2, 4] }
  why: "En una app con muchas vistas, quien la usa a diario llega más rápido con el teclado que navegando menús; es el patrón que ya conocen de otras herramientas."
  how: "Command (cmdk / shadcn) en un diálogo con ⌘K y Ctrl+K: navegación, acciones frecuentes y recientes, con búsqueda difusa. Accesible: foco atrapado, flechas y Enter, Escape cierra."
  verify:
    - { type: grep, pattern: "cmdk|CommandDialog|CommandPalette|kbar|ninja-keys", glob: "**/*.{tsx,jsx,ts,json}" }
  references: ["https://ui.shadcn.com/docs/components/command"]

- id: shortcut-hints
  title: "Atajos de teclado visibles junto a la acción (tooltip, menú o botón)"
  category: ux
  level: recommended
  phase: build.ux
  since: "2026.11.1"
  when: { any: [ { type: { any: [saas, internal-app] } }, { capabilities: [admin-panel] }, { signals: { has_tables: true } } ] }
  depends_on: [a11y-keyboard]
  effort: { size: S, hours: [1, 3] }
  why: "Un atajo que nadie ve no se usa; mostrarlo donde está la acción lo enseña sin manual."
  how: "<kbd> (o un componente Kbd) en tooltips, menús y botones; aria-keyshortcuts en el elemento. Los atajos de una sola tecla se pueden desactivar o cambiar (WCAG 2.1.4) y no chocan con los del navegador ni con lectores de pantalla."
  verify:
    - { type: grep, pattern: "<kbd|<Kbd|KbdGroup|aria-keyshortcuts", glob: "**/*.{tsx,jsx,astro,vue,svelte}" }
  references: ["https://www.w3.org/WAI/WCAG22/Understanding/character-key-shortcuts.html"]

- id: stale-while-revalidate
  title: "Datos del cliente con stale-while-revalidate: mostrar lo que hay y refrescar en segundo plano"
  category: ux
  level: recommended
  phase: build.ux
  since: "2026.11.1"
  when: { signals: { has_db: true } }
  effort: { size: S, hours: [1, 3] }
  why: "Volver a una vista que ya se vio y encontrarla vacía mientras carga se siente lento; mostrar lo último que se tenía y actualizarlo después se siente inmediato."
  how: "SWR o TanStack Query con staleTime y revalidación al enfocar la ventana y al reconectar; en respuestas HTTP públicas, Cache-Control con stale-while-revalidate. Los datos con dinero o permisos se revalidan antes de actuar."
  verify:
    - { type: grep, pattern: "useSWR|from ['\"]swr['\"]|@tanstack/react-query|useQuery\\(|staleTime|stale-while-revalidate", glob: "**/*.{ts,tsx,js,jsx,json}" }
  references: ["https://web.dev/articles/stale-while-revalidate"]

- id: view-transitions
  title: "View Transitions entre páginas y estados, con respaldo sin animación"
  category: ux
  level: optional
  phase: build.ux
  since: "2026.11.1"
  when: { not: { type: { any: [internal-app, landing] } } }
  level_overrides:
    - { when: { type: { any: [portfolio, ecommerce] } }, level: recommended }
  depends_on: [a11y-reduced-motion]
  effort: { size: S, hours: [1, 4] }
  why: "Una transición continua entre una lista y su detalle (la imagen que crece, el título que se mueve) explica a dónde se fue el usuario mejor que un corte seco."
  how: "document.startViewTransition (o <ViewTransition> / @view-transition de CSS) con view-transition-name en los elementos compartidos; sin soporte, navegación normal; desactivada con prefers-reduced-motion."
  verify:
    - { type: grep, pattern: "startViewTransition|view-transition|ViewTransition|viewTransition", glob: "**/*.{ts,tsx,js,jsx,css,astro,vue,svelte}" }
  references: ["https://developer.chrome.com/docs/web-platform/view-transitions"]

- id: swipe-sheets
  title: "Hojas inferiores que se cierran deslizando, con botón de cerrar como alternativa"
  category: ux
  level: recommended
  phase: build.ux
  since: "2026.11.1"
  when: { type: { any: [ecommerce, saas, marketplace, booking, directory] } }
  depends_on: [a11y-keyboard]
  effort: { size: S, hours: [2, 4] }
  why: "En móvil, un panel que sube desde abajo se cierra con el pulgar; un diálogo centrado con una X arriba queda lejos."
  how: "Drawer (vaul / shadcn) en móvil y Dialog en escritorio; asa para arrastrar, cierre por distancia o velocidad, puntos de anclaje si hay varios tamaños, scroll del fondo bloqueado. El gesto nunca es la única vía: botón de cerrar y Escape siempre."
  verify:
    - { type: grep, pattern: "vaul|DrawerContent|BottomSheet|bottom-sheet|dragConstraints|@use-gesture", glob: "**/*.{tsx,jsx,ts,json}" }

- id: interruptible-motion
  title: "Animaciones interrumpibles: responden a mitad de camino, sin saltos ni bloqueos"
  category: ux
  level: recommended
  phase: build.ux
  since: "2026.11.1"
  depends_on: [motion-transitions]
  effort: { size: S, hours: [1, 3] }
  why: "Si abrir y cerrar rápido un menú lo deja trabado o lo hace saltar, la interfaz se siente torpe; una animación debe poder revertirse desde donde va."
  how: "Transiciones CSS (no @keyframes) para estados reversibles; resortes (motion, react-spring) para gestos; animar solo transform y opacity. Al interrumpir, partir de la posición y velocidad actuales. Nada de pointer-events: none mientras anima."
  verify:
    - { type: manual, prompt: "Abrir y cerrar rápido el menú, el modal y el acordeón a mitad de la animación no produce saltos ni bloquea clics" }

- id: menu-safe-triangle
  title: "Menús con submenú: el cursor puede viajar en diagonal sin que se cierre (zona segura o hover intent)"
  category: ux
  level: optional
  phase: build.ux
  since: "2026.11.1"
  when: { type: { any: [ecommerce, marketplace, corporate, saas, directory] } }
  depends_on: [no-hover-only]
  effort: { size: XS, hours: [0.5, 2] }
  why: "Al ir del menú a su submenú en diagonal, el cursor cruza otra opción y el submenú se cierra; es el defecto clásico de los mega menús."
  how: "Radix (NavigationMenu, DropdownMenu, Menubar) ya trae la zona segura. En un menú propio: triángulo entre el cursor y el submenú, o un retraso de 100–200 ms al cerrar (hover intent). En táctil y teclado abre por clic."
  verify:
    - { type: grep, pattern: "@radix-ui/react-(navigation-menu|dropdown-menu|menubar|hover-card)|safeTriangle|safe-triangle|safePolygon|hoverIntent|hover-intent|react-aria", glob: "**/*.{tsx,jsx,ts,json}" }
