# Rutas sensibles: editarlas pide una auditoría de mep-security (hook PostToolUse y mod gate).
# Agrupadas por tema: cada ítem de seguridad declara `sensitive: [<grupo>]`, y su reporte de mep-security
# cubre siempre los archivos del repo de esos grupos (quien lo registra puede agregar más, nunca quitar).
groups:
  auth:
    - "**/auth/**"
    - "**/*auth*.{ts,tsx,js,jsx}"
    - "**/middleware.{ts,js}"
  payments:
    - "**/{payments,billing,checkout,stripe}/**"
    - "**/webhooks/**"
  db:
    - "supabase/migrations/**"
    - "**/migrations/**"
    - "**/*.sql"
    - "**/{policies,rls}/**"
  config:
    - ".env.example"
    - "next.config.{js,mjs,ts}"
    - "vercel.json"
    - "**/middleware.{ts,js}"
    - "**/{security,secrets}*.{ts,js}"
