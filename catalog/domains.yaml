# Dominios y subdominios del catálogo (borrador de la rama restructure).
# - items: cada ítem existente tiene UN solo subdominio "hogar"; ahí vive su estado, su nivel y su cierre.
# - proposed: ítems nuevos propuestos para ese subdominio (aún no están en el catálogo).
# - links: otros subdominios donde el ítem también se muestra (solo vista; no duplica estado ni bloqueos).
# - Un dominio o subdominio se puede apagar entero (con razón en el log). Lo que no aplica al scope ya queda fuera por su `when`.
#   Los ítems 🔒 nunca se apagan.
domains:
  ui:
    label: UI
    description: 'Cómo se ve: sistema de diseño, tipografía, color, movimiento y adaptación a pantallas.'
    subdomains:
      design-system:
        label: Sistema de diseño
        description: Tokens, componentes, escalas y estados visuales.
        items: [design-tokens, design-theme-ready, design-system-components, design-system-page, custom-components, no-hardcoded-colors, no-inline-styles, spacing-scale, interactive-states, continuous-corners]
      typography:
        label: Tipografía
        description: Jerarquía, fuentes, números y largo de línea.
        items: [text-hierarchy, font-families, tabular-numbers, text-balance, line-length]
      color-theme:
        label: Color y tema
        description: Modo oscuro y color del navegador.
        items: [dark-mode, theme-color]
      motion:
        label: Movimiento
        description: Transiciones, View Transitions y animaciones interrumpibles.
        items: [motion-transitions, view-transitions, interruptible-motion]
      responsive:
        label: Responsive
        description: Mobile first, anchos, áreas seguras y capturas por ancho.
        items: [mobile-first, responsive-screenshots, no-hover-only, safe-areas-dvh]
  ux:
    label: UX
    description: 'Cómo se usa: estados, formularios, navegación, tablas y protección de errores.'
    subdomains:
      feedback:
        label: Retroalimentación y estados
        description: Cargando, vacío, error, progreso, toasts y páginas de error.
        items: [data-view-states, skeletons, page-progress-bar, real-progress, pending-buttons, optimistic-ui, toasts, stale-while-revalidate, live-dropzone, error-pages]
      forms:
        label: Formularios
        description: Campos, validación, autocompletado y mensajes de éxito.
        items: [form-floating-label, form-input-types, form-autocomplete, form-validation-timing, form-keep-input, form-required-marks, form-password-ux, form-character-counter, form-input-masks, otp-autofill, inline-validation, form-thank-you]
      navigation:
        label: Navegación e interacción
        description: Menús, atajos, hojas y comandos.
        items: [nav-mobile-menu, nav-active-page, nav-history, nav-logo-footer, command-menu, shortcut-hints, menu-safe-triangle, swipe-sheets]
      data-views:
        label: Tablas y búsqueda
        description: Tablas, filtros, exportar y búsqueda.
        items: [table-url-state, table-states, table-sticky-header, table-mobile, table-bulk-actions, csv-export, table-virtualization, search-url-query, search-typo-tolerance, search-shortcut]
      safe-actions:
        label: Acciones seguras
        description: Deshacer, confirmar y no perder trabajo.
        items: [destructive-severity, unsaved-changes-warning, autosave-drafts, session-expiry-warning]
      dates:
        label: Fechas y horas
        description: Cómo se muestran y agendan las horas.
        items: [timezone-display, timezone-scheduling]
      conversion:
        label: Conversión
        description: CTA visible y fijo en móvil.
        items: [cta-above-fold, sticky-mobile-cta]
      principles:
        label: Principios
        description: Leyes de UX y principios de UI.
        items: [ux-laws, ui-principles]
