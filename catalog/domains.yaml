    label: Analytics
    description: Measure usage and conversion.
    subdomains:
      tracking:
        label: Measurement
        description: Installation, event plan, and funnel.
        items: [analytics-installed, analytics-event-plan, analytics-funnel]
  infra:
    label: Infrastructure and operations
    description: Deployment, monitoring, scale, and costs.
    subdomains:
      deploy:
        label: Deployment and environments
        description: Separate environments and walking skeleton in preview.
        items: [separate-environments, walking-skeleton]
      observability:
        label: Observability
        description: Uptime, health, errors, logs, metrics, and alerts.
        items: [uptime-monitor, health-endpoint, status-page, cron-monitoring, error-alerts-routed, error-monitoring, structured-logs, metrics-and-traces]
      scale:
        label: Scale and caching
        description: Load balancing, caching, and CDN.
        items: [load-balancing, server-caching, cdn]
      operations:
        label: Operations and costs
        description: Runbook and cost review.
        items: [ops-runbook, cost-control, cost-review]
  quality:
    label: Quality and process
    description: 'How it''s built and delivered: code by language, testing, git, documents, and handover.'
    subdomains:
      principles:
        label: Principles (any language)
        description: Mantra, structure, code maps, quality review, and Twelve-Factor.
        items: [code-principles, code-structure, code-maps, quality-review, twelve-factor]
      javascript:
        label: JavaScript
        description: 'Running JS/TS ecosystem: formatting, lint, cycles, dead code, and debug leftovers.'
        activates_when: has_javascript (package.json with JS or TS code)
        items: [formatter, strict-lint, no-import-cycles, no-debug-leftovers, no-duplication-dead-code, js-eslint-security, js-error-handling, js-package-hygiene]
      typescript:
        label: TypeScript
        description: Strict types and compiler safety.
        activates_when: has_typescript (tsconfig.json)
        items: [strict-types, ts-no-ignore, ts-type-aware-lint, ts-unchecked-index, ts-boundary-validation]
      css:
        label: CSS
        description: Lint, specificity, and style weight.
        activates_when: has_css (.css/.scss files or Tailwind)
        items: [css-lint, css-specificity, css-unused-size, css-tailwind-conventions]
      html:
        label: HTML
        description: Valid, semantic HTML with no inline code.
        activates_when: has_html (HTML, JSX, Astro, or templates)
        items: [html-valid, html-semantic, html-no-inline-handlers]
      sql:
        label: SQL
        description: Safe, linted migrations and queries.
        activates_when: has_sql (.sql files or migrations)
        items: [sql-lint, sql-migration-safety, sql-indexes-naming]
      python:
        label: Python
        description: Ruff, mypy, pytest, pip-audit, and vulture.
        activates_when: has_python (pyproject.toml, requirements, uv.lock)
        items: [py-lint-format, py-strict-types, py-tests, py-deps-audit, py-dead-code]
      frameworks:
        label: Frameworks (React, Next, Astro…)
        description: 'Framework-specific rules: hooks, JSX accessibility, and client/server boundary.'
        activates_when: has_react / Next / Astro / Vue (dependency detected)
        items: [react-hooks-lint, jsx-a11y-lint, client-server-boundary]
      config-ci:
        label: Configuration, CI, and containers
        description: Workflows, shell scripts, Dockerfile, and line endings.
        activates_when: Actions workflows, .sh scripts, or Dockerfile present
        items: [ci-actionlint, shell-shellcheck, docker-hadolint, editorconfig-eol]
      testing:
        label: Testing and build
        description: Unit, end-to-end, and clean build.
        items: [unit-tests, test-coverage, e2e-tests, build-lint-typecheck]
      git-docs:
        label: Git and documentation
        description: Protected branch, commits, PR, README, and ADR.
        items: [git-protected-main, git-conventional-commits, git-pr-template, git-tags-codeowners, adr-log, readme, gitignore, env-example]
      planning:
        label: Planning documents
        description: PRD, TRD, plan, flows, and schema.
        items: [plan-prd, plan-trd, plan-implementation, plan-flows, plan-schema]
      handover:
        label: Client handover
        description: Handover and manual.
        items: [client-handover, client-manual]
