        description: HTTPS, headers, CSP, and hidden errors.
        items: [https-hsts, security-headers, csp-strict, security-txt, production-errors-hidden, debug-mode-off]
      supply-chain:
        label: Dependencies and analysis
        description: Lockfile, vulnerabilities, and static analysis.
        items: [lockfile-committed, no-critical-vulnerabilities, dependency-scan-ci, dependency-updates-bot, static-analysis-ci, unused-dependencies]
      abuse:
        label: Abuse and bots
        description: Anti-spam, form rate limits, and WAF.
        items: [form-anti-spam, form-rate-limit, waf-ddos]
      data-protection:
        label: Sensitive data
        description: Field-level encryption and access logging.
        items: [sensitive-data-encryption, sensitive-data-access-log]
      assurance:
        label: Verification
        description: Pentest before launch.
        items: [pentest-before-launch]
  privacy:
    label: Privacy
    description: What data is requested, how long it's kept, and who it's shared with.
    subdomains:
      data-governance:
        label: Data governance
        description: Retention, minimization, rights, processors, and breaches.
        items: [data-retention, data-minimization, data-subject-requests, data-processing-agreements, third-party-disclosure, third-party-sdk-audit, breach-response-plan, health-no-tracking]
      cookies:
        label: Cookies and consent
        description: Inventory, banner, logging, and privacy signals.
        items: [cookie-inventory, cookie-policy, cookie-attributes, consent-banner, consent-before-load, consent-log, gpc-signal, do-not-sell-link, cookieless-analytics, embeds-facade]
      consent:
        label: Notices and consent in forms
        description: What to say when requesting data and marketing consent.
        items: [form-consent-notice, marketing-consent]
  legal:
    label: Legal
    description: Policies, consumer rights, intellectual property, and obligations by market.
    subdomains:
      policies:
        label: Policies and business information
        description: Privacy, terms, refunds, contact, and identity.
        items: [privacy-policy, terms-of-service, terms-versioned, refund-policy, legal-last-updated, visible-contact, business-identity]
      consumer:
        label: Consumer and advertising
        description: No dark patterns, real reviews, substantiated claims, and right of withdrawal.
        items: [no-dark-patterns, no-fake-reviews, substantiated-claims, eu-withdrawal-right, eu-order-button, eu-price-reductions, mx-consumer-ecommerce, br-consumer, uk-consumer-contracts, ecommerce-shipping-returns, eu-dsa]
      content-terms:
        label: Third-party content
        description: Terms for sellers and for user-generated content.
        items: [marketplace-seller-terms, ugc-content-terms, portfolio-client-permission]
      ip-licenses:
        label: Intellectual property and licenses
        description: Images, fonts, open source, and DMCA.
        items: [asset-licenses, intellectual-property, open-source-licenses, usa-dmca-agent, maps-attribution]
      sensitive-sectors:
        label: Health and financial data
        description: HIPAA, GDPR Art. 9, and explicit consent.
        items: [usa-hipaa, eu-health-explicit-consent, mx-sensitive-consent]
      mx:
        label: Mexico
        description: Privacy notice and local rules.
        items: [mx-privacy-notice]
      usa:
        label: United States
        description: State privacy and CAN-SPAM.
        items: [usa-privacy-policy, usa-can-spam]
      ca:
        label: Canada
        description: PIPEDA, Quebec Law 25, and CASL.
        items: [ca-pipeda, ca-qc-law25, ca-casl]
      eu:
        label: European Union
        description: GDPR, representative, Impressum, and SCA.
        items: [eu-gdpr, eu-representative, eu-de-impressum, eu-sca]
      uk:
        label: United Kingdom
        description: UK GDPR and ICO fee.
        items: [uk-gdpr, uk-ico-fee]
      br:
        label: Brazil
        description: LGPD.
        items: [br-lgpd]
      in:
        label: India
        description: DPDP and grievance officer.
        items: [in-dpdp, in-grievance-officer]
  seo:
    label: SEO
    description: Help search engines and AI find and understand the site.
    subdomains:
      technical:
        label: Technical SEO
        description: Titles, canonical, robots, sitemap, URLs, and redirects.
        items: [unique-title, unique-description, canonical-link, robots-txt, sitemap-xml, noindex-preview, clean-urls, public-page-urls, sitemap-indexable-only, noindex-private-pages, robots-allows-assets, redirects-on-change, crawlable-links, canonical-redirects, search-console, heading-hierarchy]
