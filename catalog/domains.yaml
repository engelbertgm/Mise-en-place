        description: JSON-LD, breadcrumbs, and schemas by type.
        items: [json-ld-base, breadcrumbs, ecommerce-product-schema, local-business-schema, blog-article-schema, directory-listing-schema]
      social-sharing:
        label: Social sharing
        description: Open Graph and preview images.
        items: [open-graph-basic, og-image-default, og-image-specs, og-image-generated]
      ai-discovery:
        label: AI discovery
        description: llms.txt and robots for AI crawlers.
        items: [llms-txt, robots-allows-ai]
      local:
        label: Local SEO
        description: Name, address, and phone, contact, and Google profile.
        items: [local-business-nap, local-business-contact, local-business-profile]
      content-types:
        label: Blog and directory
        description: Feed and crawlable facets.
        items: [blog-feed, directory-facets-crawl]
      migration:
        label: Site migration
        description: URL inventory, 301s, and monitoring.
        items: [migration-url-inventory, migration-301, migration-preserve-seo, migration-monitoring, migration-backup]
