    label: Security
    description: 'Prevent leaks and abuse: secrets, inputs, headers, dependencies, and testing.'
    subdomains:
      secrets:
        label: Secrets
        description: Keys kept out of the repo, per environment, with rotation.
        items: [no-secrets-in-repo, env-gitignored, public-env-prefix, server-only-keys, secrets-scan-ci, keys-per-environment, key-rotation-procedure, logs-without-secrets, secrets-history-clean]
      input:
