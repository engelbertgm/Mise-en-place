# Catalog domains and subdomains: the single source of each item's "home".
# A new item is added here; the catalog won't load if any item has no home.
# - items: each item has ONE home subdomain; its state, level, and closure live there.
# - links: other subdomains where the item is also shown (view only; does not duplicate state or blockers).
# - A domain or subdomain can be turned off entirely (with a reason in the log). Anything that doesn't apply to the scope is already excluded by its `when`.
#   🔒 items are never turned off.
domains:
  ui:
    label: UI
    description: 'How it looks: design system, typography, color, motion, and adapting to screen sizes.'
    subdomains:
      design-system:
        label: Design system
        description: Tokens, components, scales, and visual states.
        items: [design-tokens, design-theme-ready, design-system-components, design-system-page, custom-components, no-hardcoded-colors, no-inline-styles, spacing-scale, interactive-states, continuous-corners]
      typography:
        label: Typography
        description: Hierarchy, fonts, numerals, and line length.
        items: [text-hierarchy, font-families, tabular-numbers, text-balance, line-length]
      color-theme:
        label: Color and theme
        description: Dark mode and browser color.
        items: [dark-mode, theme-color]
      motion:
        label: Motion
        description: Transitions, View Transitions, and interruptible animations.
        items: [motion-transitions, view-transitions, interruptible-motion]
      responsive:
        label: Responsive
        description: Mobile first, widths, safe areas, and screenshots per width.
        items: [mobile-first, responsive-screenshots, no-hover-only, safe-areas-dvh]
  ux:
    label: UX
    description: 'How it''s used: states, forms, navigation, tables, and error protection.'
    subdomains:
      feedback:
        label: Feedback and states
        description: Loading, empty, error, progress, toasts, and error pages.
        items: [data-view-states, skeletons, page-progress-bar, real-progress, pending-buttons, optimistic-ui, toasts, stale-while-revalidate, live-dropzone, error-pages]
      forms:
        label: Forms
        description: Fields, validation, autofill, and success messages.
        items: [form-floating-label, form-input-types, form-autocomplete, form-validation-timing, form-keep-input, form-required-marks, form-password-ux, form-character-counter, form-input-masks, otp-autofill, inline-validation, form-thank-you]
      navigation:
        label: Navigation and interaction
        description: Menus, shortcuts, sheets, and commands.
        items: [nav-mobile-menu, nav-active-page, nav-history, nav-logo-footer, command-menu, shortcut-hints, menu-safe-triangle, swipe-sheets]
      data-views:
        label: Tables and search
        description: Tables, filters, export, and search.
        items: [table-url-state, table-states, table-sticky-header, table-mobile, table-bulk-actions, csv-export, table-virtualization, search-url-query, search-typo-tolerance, search-shortcut]
      safe-actions:
        label: Safe actions
        description: Undo, confirm, and never lose work.
        items: [destructive-severity, unsaved-changes-warning, autosave-drafts, session-expiry-warning]
      dates:
        label: Dates and times
        description: How times are displayed and scheduled.
        items: [timezone-display, timezone-scheduling]
      conversion:
        label: Conversion
        description: Visible, sticky CTA on mobile.
        items: [cta-above-fold, sticky-mobile-cta]
      principles:
        label: Principles
        description: UX laws and UI principles.
        items: [ux-laws, ui-principles]
  accessibility:
    label: Accessibility
    description: Everyone can use it (WCAG 2.2 AA).
    subdomains:
      perceivable:
        label: Perceivable
        description: Contrast, alt text, zoom, captions, and reduced motion.
        items: [a11y-contrast, a11y-alt-text, a11y-zoom, a11y-reduced-motion, media-captions, media-audio-description, maps-text-alternative]
      operable:
        label: Operable
        description: Keyboard, focus, skip links, and touch targets.
        items: [a11y-keyboard, a11y-focus-visible, a11y-skip-link, touch-targets, destructive-accessible]
      understandable:
        label: Understandable
        description: Labels, form errors, structure, and language.
        items: [a11y-form-labels, a11y-form-errors, a11y-landmarks, html-lang]
      compliance:
        label: Compliance and testing
        description: Accessibility statement, automated tests, and laws (ADA, AODA).
        items: [accessibility-statement, a11y-automated-tests, ca-on-aoda, usa-ada]
  frontend:
    label: Frontend
    description: How it loads and renders in the browser.
    subdomains:
      rendering:
        label: Rendering
        description: Content-filled HTML, pre-rendered pages, no console errors or source maps.
        items: [server-rendered-content, prerender-public-pages, no-console-errors, no-public-source-maps]
      performance:
        label: Performance
        description: Images, fonts, bundle, and Web Vitals.
        items: [modern-image-formats, image-loading-priority, media-dimensions, web-fonts, compression-caching, core-web-vitals-budget, bundle-budget, image-placeholders]
      media:
        label: Video and audio
        description: Playback and streaming.
        items: [media-playback, media-streaming]
      pwa-offline:
        label: PWA and offline
        description: Installable, offline, and back gesture.
        items: [pwa-basics, pwa-install-prompt, predictive-back, offline-strategy, web-manifest]
      html-baseline:
        label: HTML baseline
        description: Charset, viewport, and favicon.
        items: [meta-charset, meta-viewport, favicon]
  i18n:
    label: Languages
    description: Multiple languages and formats per market.
    subdomains:
      formats:
        label: Formats and interface
        description: Dates, numbers, currency, language selector, and long text.
        items: [i18n-intl-formats, i18n-language-selector, i18n-text-expansion, i18n-currency-by-market, copy-in-translation-files]
      market-languages:
        label: Languages by market
        description: Which languages each market requires.
        items: [br-language, ca-language, ca-french, eu-language, in-language, in-hindi, mx-language, uk-language, usa-language, usa-spanish]
      routing:
        label: Routing and signals
        description: hreflang and locale when sharing.
        items: [i18n-hreflang, og-locale]
  backend:
    label: Backend
    description: 'Server and services: API, messaging, real time, AI, files, and integrations.'
    subdomains:
      api:
        label: API
        description: Authentication, versioning, errors, documentation, and rate limits.
        items: [api-auth, api-cors, api-versioning, api-docs, api-error-format, api-keys-hashed, api-rate-limit, rate-limit-responses]
      reliability:
        label: Reliability
        description: Queues, retries, circuit breaker, and idempotency.
        items: [message-queue, resilient-external-calls, idempotency-keys]
      messaging:
        label: Email, newsletter, and notifications
        description: Transactional email, newsletter, and alerts.
        items: [email-auth-dns, email-templates, email-unsubscribe-marketing, react-email, newsletter-signup, newsletter-consent, newsletter-double-opt-in, newsletter-unsubscribe, newsletter-sender-address, newsletter-no-purchased-lists, newsletter-preferences, notification-center, push-permission-timing, notification-batching]
      realtime:
        label: Real time
        description: Channels, presence, and reconnection.
        items: [realtime-resilience, realtime-channel-auth, realtime-presence]
      ai:
        label: AI
        description: Spend, prompt injection, moderation, and evaluations.
        items: [ai-spend-limits, ai-prompt-injection, ai-disclosure, ai-resilience, ai-moderation-privacy, ai-evals]
      uploads:
        label: Files
        description: Validation, size, signed URLs, and antivirus.
        items: [upload-size-limits, upload-private-signed-urls, upload-validation, upload-antivirus, upload-strip-metadata, upload-type-allowlist, upload-content-hardening, upload-served-safely]
      integrations:
        label: Integrations
        description: Maps and external services.
        items: [maps-key-restricted]
  auth:
    label: Accounts and access
    description: 'Who you are and what you can do: passwords, sessions, roles, and account lifecycle.'
    subdomains:
      credentials:
        label: Credentials
        description: Passwords, verification, MFA, and sign-in alerts.
        items: [password-hashing, password-recovery, email-verification, mfa-optional, admin-mfa, new-login-alert, auth-rate-limit, no-user-enumeration, password-reset-expiry]
      sessions:
        label: Sessions
        description: Secure cookies, expiry, and CSRF.
        items: [secure-session-cookies, session-expiry, csrf-protection]
      access-control:
        label: Authorization
        description: Roles, per-resource permissions, and tenant isolation.
        items: [resource-authorization, admin-roles, saas-tenant-isolation, internal-no-public-signup, internal-sso]
      account-lifecycle:
        label: Account lifecycle
        description: Account deletion, data export, and offboarding.
        items: [account-deletion, data-export, internal-offboarding]
      audit:
        label: Audit
        description: Who did what and when.
        items: [admin-audit-log, internal-audit-log, saas-activity-log]
  payments:
    label: Payments
    description: 'Getting paid right: checkout, subscriptions, usage billing, taxes, and multi-party payments.'
    subdomains:
      checkout:
        label: Checkout
        description: Server-side prices, payment links, webhooks, receipts, and total price.
        items: [hosted-checkout, server-side-prices, payment-links-setup, payment-result-pages, payment-receipts, webhook-signature, webhook-idempotency, ecommerce-all-in-price]
      subscriptions:
        label: Subscriptions
        description: Cancel, notify, retry charges, and change plans.
        items: [subscription-cancel-online, subscription-disclosure, subscription-reminders, subscription-dunning, subscription-plan-changes, subscription-billing-portal, subscription-webhook-sync]
      usage-billing:
        label: Usage billing
        description: Events, tiers, caps, invoices, and reconciliation.
        items: [usage-events-idempotent, usage-pricing-tiers, usage-spend-cap, usage-visible, usage-invoice-detail, usage-reconciliation, usage-pricing-terms]
      tax-invoicing:
        label: Taxes and invoicing
        description: Taxes, VAT, and CFDI.
        items: [tax-handling, eu-vat, mx-cfdi]
      marketplace-payouts:
        label: Multi-party payments
        description: Verified sellers, split payments, and disputes.
        items: [marketplace-seller-verification, marketplace-split-payments, marketplace-disputes]
  database:
    label: Database
    description: How your own data is stored and protected.
    subdomains:
      access:
        label: Data access
        description: RLS, least privilege, and encrypted connections.
        items: [rls-all-tables, rls-policies-per-operation, db-least-privilege, db-ssl]
      model:
        label: Data model
        description: Soft delete and UTC dates.
        items: [soft-delete, timezone-utc-storage]
      operations:
        label: Migrations and backups
        description: Versioned migrations and tested restores.
        items: [migrations-backups]
      scale:
        label: Data scale
        description: Replicas, sharding, consistent hashing, and consistency model.
        items: [replication-recovery, sharding-strategy, consistent-hashing, consistency-model]
