        items: [no-placeholder-content, final-copy, microcopy, voice-and-tone, about-faq]
      editorial:
        label: Editorial
        description: Authors and case studies.
        items: [blog-author-pages, portfolio-case-studies]
      cms:
        label: CMS
        description: No-code editing, preview, and versions.
        items: [cms-editing, cms-preview-roles, cms-images, cms-guide-adr, cms-versioning]
  product:
    label: Product by type
    description: Features specific to each project type.
    subdomains:
      ecommerce:
        label: Store
        description: Inventory, orders, and cart.
        items: [ecommerce-no-oversell, ecommerce-order-emails, ecommerce-cart-persistence]
      booking:
        label: Bookings
        description: Availability, double booking, and cancellations.
        items: [booking-no-double, booking-availability, booking-confirmation, booking-cancellation-policy, booking-admin, booking-extras]
      saas:
