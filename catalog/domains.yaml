  quality:
    label: Calidad y proceso
    description: 'Cómo se construye y se entrega: código por lenguaje, pruebas, git, documentos y entrega.'
    subdomains:
      principles:
        label: Principios (cualquier lenguaje)
        description: Mantra, estructura, mapas de código, revisión de calidad y Twelve-Factor.
        items: [code-principles, code-structure, code-maps, quality-review, twelve-factor]
      javascript:
        label: JavaScript
        description: 'Ecosistema JS/TS en ejecución: formato, lint, ciclos, código muerto y restos de depuración.'
        activates_when: has_javascript (package.json con código JS o TS)
        items: [formatter, strict-lint, no-import-cycles, no-debug-leftovers, no-duplication-dead-code]
        proposed:
        - id: js-eslint-security
          title: 'Reglas de seguridad en el lint: sin eval, new Function ni HTML dinámico'
        - id: js-error-handling
          title: 'Errores no tragados: sin catch vacíos ni promesas sin manejar'
        - id: js-package-hygiene
          title: package.json con engines, packageManager y scripts estándar (lint, test, build)
      typescript:
        label: TypeScript
        description: Tipos estrictos y seguridad del compilador.
        activates_when: has_typescript (tsconfig.json)
        items: [strict-types]
        proposed:
        - id: ts-no-ignore
          title: '@ts-expect-error solo con razón; sin @ts-ignore ni @ts-nocheck'
        - id: ts-type-aware-lint
          title: 'Lint con tipos (typescript-eslint): sin promesas flotantes ni mal usadas'
        - id: ts-unchecked-index
          title: noUncheckedIndexedAccess y exactOptionalPropertyTypes activos
        - id: ts-boundary-validation
          title: Datos externos (API, formularios, env) validados con un esquema (Zod) antes de usarse
      css:
        label: CSS
        description: Lint, especificidad y peso de los estilos.
        activates_when: has_css (archivos .css/.scss o Tailwind)
        items: []
        proposed:
        - id: css-lint
          title: Stylelint sin errores
        - id: css-specificity
          title: Sin !important ni selectores por id; especificidad baja
        - id: css-unused-size
          title: CSS sin uso eliminado y peso del CSS dentro de presupuesto
        - id: css-tailwind-conventions
          title: Orden de clases automático y sin valores arbitrarios fuera de los tokens (Tailwind)
      html:
        label: HTML
        description: HTML válido, semántico y sin código inline.
        activates_when: has_html (HTML, JSX, Astro o plantillas)
        items: []
        proposed:
        - id: html-valid
          title: HTML válido en la salida del build (html-validate o Nu validator)
        - id: html-semantic
          title: 'Elementos semánticos: button y a para acciones, listas para listas, tablas solo para datos'
        - id: html-no-inline-handlers
          title: Sin onclick= ni scripts o estilos inline en el HTML (compatible con CSP estricta)
      sql:
        label: SQL
        description: Migraciones y consultas seguras y con linter.
        activates_when: has_sql (archivos .sql o migraciones)
        items: []
        proposed:
        - id: sql-lint
          title: Migraciones y consultas con linter (sqlfluff o squawk) sin errores
        - id: sql-migration-safety
          title: 'Migraciones seguras: índices concurrentes, sin bloqueos largos, con vuelta atrás o plan'
        - id: sql-indexes-naming
          title: Claves foráneas con índice y nombres consistentes
      python:
        label: Python
        description: Ruff, mypy, pytest, pip-audit y vulture.
        activates_when: has_python (pyproject.toml, requirements, uv.lock)
        items: [py-lint-format, py-strict-types, py-tests, py-deps-audit, py-dead-code]
      frameworks:
        label: Frameworks (React, Next, Astro…)
        description: 'Reglas propias del framework: hooks, accesibilidad en JSX y frontera cliente/servidor.'
        activates_when: has_react / Next / Astro / Vue (dependencia detectada)
        items: []
        proposed:
        - id: react-hooks-lint
          title: Reglas de hooks de React en error
        - id: jsx-a11y-lint
          title: Lint de accesibilidad en JSX (jsx-a11y) sin errores
        - id: client-server-boundary
          title: '''use client'' solo donde hace falta; el código de servidor nunca lo importa el cliente'
      config-ci:
        label: Configuración, CI y contenedores
        description: Workflows, scripts de shell, Dockerfile y finales de línea.
        activates_when: workflows de Actions, scripts .sh o Dockerfile presentes
        items: []
        proposed:
        - id: ci-actionlint
          title: Workflows de GitHub Actions validados (actionlint) y acciones fijadas por versión
        - id: shell-shellcheck
          title: Scripts de shell sin errores de shellcheck
        - id: docker-hadolint
          title: Dockerfile sin errores (hadolint), usuario sin root e imagen fijada
        - id: editorconfig-eol
          title: .editorconfig y .gitattributes con finales de línea LF (evita diferencias Windows/Linux)
      testing:
        label: Pruebas y build
        description: Unitarias, end-to-end y build limpio.
        items: [unit-tests, test-coverage, e2e-tests, build-lint-typecheck]
      git-docs:
        label: Git y documentación
        description: Rama protegida, commits, PR, README y ADR.
        items: [git-protected-main, git-conventional-commits, git-pr-template, git-tags-codeowners, adr-log, readme, gitignore, env-example]
      planning:
        label: Documentos de planeación
        description: PRD, TRD, plan, flujos y esquema.
        items: [plan-prd, plan-trd, plan-implementation, plan-flows, plan-schema]
      handover:
        label: Entrega al cliente
        description: Traspaso y manual.
        items: [client-handover, client-manual]
